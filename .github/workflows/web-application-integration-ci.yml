name: Web Application Integration CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/integration-web-application/**"
      - "examples/web-reference/integration.html"
      - "examples/web-reference/integration-reference.mjs"
      - "scripts/test-web-application-integration.mjs"
      - "tests/browser/web-application-integration.spec.mjs"
      - ".github/workflows/web-application-integration-ci.yml"
  pull_request:
    paths:
      - "packages/integration-web-application/**"
      - "examples/web-reference/integration.html"
      - "examples/web-reference/integration-reference.mjs"
      - "scripts/test-web-application-integration.mjs"
      - "tests/browser/web-application-integration.spec.mjs"
      - ".github/workflows/web-application-integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-application-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Test Web application integration host
        run: node scripts/test-web-application-integration.mjs
