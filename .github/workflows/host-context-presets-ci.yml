name: Host Context Presets CI

on:
  push:
    branches: [main]
    paths:
      - "packages/integration-host-context/**"
      - "scripts/test-host-context-presets.mjs"
      - "packages/adapter-compose/pom.xml"
      - ".github/workflows/host-context-presets-ci.yml"
  pull_request:
    paths:
      - "packages/integration-host-context/**"
      - "scripts/test-host-context-presets.mjs"
      - "packages/adapter-compose/pom.xml"
      - ".github/workflows/host-context-presets-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: node scripts/test-host-context-presets.mjs
