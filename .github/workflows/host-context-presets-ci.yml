name: Host Context Presets CI

on:
  push:
    branches: [main]
    paths:
      - "packages/integration-host-context/**"
      - "scripts/test-host-context-presets.mjs"
      - "packages/adapter-compose/pom.xml"
      - ".github/workflows/host-context-presets-ci.yml"
  pull_request:
    paths:
      - "packages/integration-host-context/**"
      - "scripts/test-host-context-presets.mjs"
      - "packages/adapter-compose/pom.xml"
      - ".github/workflows/host-context-presets-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: node scripts/test-host-context-presets.mjs
