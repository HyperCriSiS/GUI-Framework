name: Maintenance Fix Form Layout Parity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fix stale Menu parity anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-reference-parity.mjs')
          text = p.read_text()
          old = 'assert.match(source, /GuiMenuItem\\(value = "locked", label = "Locked action", disabled = true\\)/, `${name} must expose a disabled Menu item`);'
          new = 'assert.match(source, /GuiMenuItem\\(value = "locked", label = "Locked action", accessibilityLabel = "Locked action", disabled = true\\)/, `${name} must expose a disabled Menu item with explicit accessibility text`);'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one stale Menu parity anchor, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          node scripts/test-reference-parity.mjs
      - name: Commit validated parity fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-reference-parity.mjs
          git commit -m 'fix(form-layout): align shared reference parity [android-ci] [device-ci]'
          git push origin HEAD:main
