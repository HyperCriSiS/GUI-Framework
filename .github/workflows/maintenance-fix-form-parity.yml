name: Maintenance Fix Form Layout Parity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fix stale Desktop reference anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-compose-desktop-reference.mjs')
          text = p.read_text()
          replacements = [
              (
                  'assert.match(source, /GuiMenuItem\\(value = "locked", label = "Locked action", disabled = true\\)/);',
                  'assert.match(source, /GuiMenuItem\\(value = "locked", label = "Locked action", accessibilityLabel = "Locked action", disabled = true\\)/);',
              ),
              (
                  'assert.match(source, /label = "Open context menu"/);',
                  'assert.match(source, /label = if \\(menuContextMode\\) "Open workspace menu" else "Open context menu"/);',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'expected one stale Desktop anchor, got {text.count(old)} for {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          node scripts/test-compose-desktop-reference.mjs
          node scripts/test-compose-android-reference.mjs
          node scripts/test-reference-parity.mjs
      - name: Commit validated reference gate fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-compose-desktop-reference.mjs
          git commit -m 'fix(form-layout): align Desktop reference gates [android-ci] [device-ci]'
          git push origin HEAD:main
