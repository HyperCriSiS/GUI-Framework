name: Maintenance Scroll Web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Add Web Scroll Container adapter and gate
        run: |
          cat > packages/adapter-web/src/scroll-container.mjs <<'EOF'
          // SPDX-License-Identifier: AGPL-3.0-or-later

          const variants = new Set(["vertical", "horizontal", "both"]);
          const sizes = new Set(["small", "medium", "large"]);

          function requireDocument(document) {
            if (!document || typeof document.createElement !== "function") {
              throw new TypeError("createGuiScrollContainer requires a DOM Document-like object");
            }
          }
          function optionalString(props, key, fallback = "") {
            if (!Object.prototype.hasOwnProperty.call(props, key)) return fallback;
            if (typeof props[key] !== "string") throw new TypeError(`GUI scroll container ${key} must be a string`);
            return props[key];
          }
          function optionalBoolean(props, key, fallback = true) {
            if (!Object.prototype.hasOwnProperty.call(props, key)) return fallback;
            if (typeof props[key] !== "boolean") throw new TypeError(`GUI scroll container ${key} must be a boolean`);
            return props[key];
          }
          function choice(value, choices, label) {
            if (!choices.has(value)) throw new Error(`Unknown GUI scroll container ${label}: ${value}`);
            return value;
          }
          function normalizeProps(props = {}) {
            return {
              accessibilityLabel: optionalString(props, "accessibilityLabel"),
              keyboardFocusable: optionalBoolean(props, "keyboardFocusable", true),
              variant: choice(props.variant ?? "vertical", variants, "variant"),
              size: choice(props.size ?? "medium", sizes, "size"),
            };
          }

          /**
           * Native scroll viewport. Scroll offsets remain owned by the platform/host:
           * the adapter never mirrors, resets or animates scrollTop/scrollLeft.
           */
          export function createGuiScrollContainer(document, initialProps = {}) {
            requireDocument(document);
            const element = document.createElement("div");
            element.className = "gui-scroll-container";
            const contentElement = document.createElement("div");
            contentElement.className = "gui-scroll-container__content";
            element.append(contentElement);
            let props = normalizeProps(initialProps);

            function render() {
              element.dataset.guiComponent = "scroll-container";
              element.dataset.guiVariant = props.variant;
              element.dataset.guiSize = props.size;
              if (props.accessibilityLabel.trim()) {
                element.setAttribute("role", "region");
                element.setAttribute("aria-label", props.accessibilityLabel);
              } else {
                element.removeAttribute("role");
                element.removeAttribute("aria-label");
              }
              if (props.keyboardFocusable) element.setAttribute("tabindex", "0");
              else element.removeAttribute("tabindex");
            }
            render();

            return {
              element,
              contentElement,
              update(nextProps = {}) {
                props = normalizeProps({ ...props, ...nextProps });
                render();
              },
              destroy() {},
            };
          }
          EOF

          cat > scripts/test-web-scroll-container.mjs <<'EOF'
          // SPDX-License-Identifier: AGPL-3.0-or-later
          import assert from "node:assert/strict";
          import { readFile, rm } from "node:fs/promises";
          import { spawnSync } from "node:child_process";
          import { createGuiScrollContainer } from "../packages/adapter-web/src/scroll-container.mjs";

          class FakeElement {
            constructor(tagName) { this.tagName=tagName.toUpperCase(); this.className=""; this.dataset={}; this.attributes=new Map(); this.children=[]; this.scrollTop=0; this.scrollLeft=0; }
            append(...children) { this.children.push(...children); }
            setAttribute(name,value) { this.attributes.set(name,String(value)); }
            getAttribute(name) { return this.attributes.get(name) ?? null; }
            removeAttribute(name) { this.attributes.delete(name); }
          }
          class FakeDocument { createElement(tagName) { return new FakeElement(tagName); } }

          const document = new FakeDocument();
          const viewport = createGuiScrollContainer(document, { accessibilityLabel:"Activity log", variant:"both", size:"large" });
          assert.equal(viewport.element.tagName,"DIV");
          assert.equal(viewport.element.dataset.guiComponent,"scroll-container");
          assert.equal(viewport.element.dataset.guiVariant,"both");
          assert.equal(viewport.element.dataset.guiSize,"large");
          assert.equal(viewport.element.getAttribute("role"),"region");
          assert.equal(viewport.element.getAttribute("aria-label"),"Activity log");
          assert.equal(viewport.element.getAttribute("tabindex"),"0");
          assert.equal(viewport.contentElement.className,"gui-scroll-container__content");
          assert.equal(viewport.element.children[0],viewport.contentElement);

          viewport.element.scrollTop=37; viewport.element.scrollLeft=19;
          viewport.update({ variant:"horizontal", size:"small", accessibilityLabel:"", keyboardFocusable:false });
          assert.equal(viewport.element.dataset.guiVariant,"horizontal");
          assert.equal(viewport.element.dataset.guiSize,"small");
          assert.equal(viewport.element.getAttribute("role"),null,"unlabelled scroll containers must not create unnamed region landmarks");
          assert.equal(viewport.element.getAttribute("aria-label"),null);
          assert.equal(viewport.element.getAttribute("tabindex"),null);
          assert.equal(viewport.element.scrollTop,37,"updates must not reset host-owned vertical scroll state");
          assert.equal(viewport.element.scrollLeft,19,"updates must not reset host-owned horizontal scroll state");
          assert.throws(()=>viewport.update({variant:"diagonal"}),/Unknown GUI scroll container variant/);
          assert.throws(()=>createGuiScrollContainer(document,{keyboardFocusable:"yes"}),/must be a boolean/);

          const irPath="build/spec-ir-web-scroll-container-test.json";
          const cssPath="build/web/scroll-container-components-test.css";
          function run(command,args,label){const result=spawnSync(command,args,{encoding:"utf8",shell:false});if(result.status!==0)throw new Error(`${label} failed:\n${result.stdout}\n${result.stderr}`);}
          try {
            run(process.execPath,["packages/compiler/src/index.mjs","--output",irPath],"Specification compiler");
            run(process.execPath,["packages/adapter-web/src/generate-components-css.mjs",irPath,cssPath],"Web component CSS generator");
            const css=await readFile(cssPath,"utf8");
            assert.match(css,/\.gui-scroll-container \{ box-sizing: border-box; min-inline-size: 0; min-block-size: 0; outline: none; \}/);
            assert.match(css,/data-gui-variant="vertical"[^\n]*overflow-y: auto; overflow-x: hidden/);
            assert.match(css,/data-gui-variant="horizontal"[^\n]*overflow-x: auto; overflow-y: hidden/);
            assert.match(css,/data-gui-variant="both"[^\n]*overflow: auto/);
            assert.match(css,/\.gui-scroll-container__content \{ box-sizing: border-box; min-inline-size: 0; min-block-size: 0; \}/);
            assert.match(css,/\.gui-scroll-container:where\(:focus-visible\)/);
            assert.doesNotMatch(css,/gui-scroll-container[^\n]*::-webkit-scrollbar/,"Scroll Container must preserve native scrollbar rendering");
          } finally { await Promise.all([rm(irPath,{force:true}),rm(cssPath,{force:true})]); }
          console.log("Native Web Scroll Container adapter and generated CSS tests passed.");
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('packages/adapter-web/src/generate-components-css.mjs')
          s=p.read_text()
          anchor='    `${scope} .gui-table { box-sizing: border-box; inline-size: 100%; border-collapse: separate; border-spacing: 0; border-style: solid; border-width: 0; overflow-wrap: anywhere; }`,'
          block='''    `${scope} .gui-scroll-container { box-sizing: border-box; min-inline-size: 0; min-block-size: 0; outline: none; }`,\n    `${scope} .gui-scroll-container__content { box-sizing: border-box; min-inline-size: 0; min-block-size: 0; }`,\n    `${scope} .gui-scroll-container:where([data-gui-variant="vertical"]) { overflow-y: auto; overflow-x: hidden; }`,\n    `${scope} .gui-scroll-container:where([data-gui-variant="horizontal"]) { overflow-x: auto; overflow-y: hidden; }`,\n    `${scope} .gui-scroll-container:where([data-gui-variant="both"]) { overflow: auto; }`,\n    `${scope} .gui-scroll-container:where([data-gui-variant="vertical"]) .gui-scroll-container__content { inline-size: 100%; }`,\n    `${scope} .gui-scroll-container:where([data-gui-variant="horizontal"]) .gui-scroll-container__content,`,\n    `${scope} .gui-scroll-container:where([data-gui-variant="both"]) .gui-scroll-container__content { inline-size: max-content; min-inline-size: 100%; }`, "",\n'''
          if anchor not in s: raise SystemExit('scroll foundation anchor missing')
          s=s.replace(anchor,block+anchor,1)
          anchor='  :where(${availableThemeIds.map((id) => `[data-gui-theme="${id}"]`).join(", ")}) .gui-form-layout,`,'
          replacement=anchor+' `  :where(${availableThemeIds.map((id) => `[data-gui-theme="${id}"]`).join(", ")}) .gui-scroll-container,`,'
          if anchor not in s: raise SystemExit('reduced motion anchor missing')
          p.write_text(s.replace(anchor,replacement,1))
          PY
      - name: Validate Scroll Web source syntax
        run: node --check packages/adapter-web/src/scroll-container.mjs && node --check scripts/test-web-scroll-container.mjs && node --check packages/adapter-web/src/generate-components-css.mjs
      - name: Run native Web Scroll Container gate
        run: node scripts/test-web-scroll-container.mjs
      - name: Test Web component generation
        run: npm run compile:spec && npm run build:web-components
      - name: Commit validated Web Scroll Container
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/adapter-web/src/scroll-container.mjs packages/adapter-web/src/generate-components-css.mjs scripts/test-web-scroll-container.mjs
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'feat(scroll-container): add native Web viewport adapter'
          git push origin HEAD:main
