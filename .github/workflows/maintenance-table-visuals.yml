name: Maintenance Table Visual Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply deterministic Table and Data Grid visuals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          theme_path = Path("spec/themes/basic.theme.json")
          theme = json.loads(theme_path.read_text())
          components = theme["components"]
          assert "table" not in components, "Basic table visual already exists"
          assert "data-grid" not in components, "Basic data-grid visual already exists"

          components["table"] = {
              "base": {
                  "root": {"fill":"{semantic.color.surfaceElevated}","foreground":"{semantic.color.textPrimary}","radius":"{radius.control}","border":{"color":"{semantic.color.border}","width":"{border.width.standard}"}},
                  "caption": {"foreground":"{semantic.color.textSecondary}","paddingHorizontal":"{spacing.md}","paddingVertical":"{spacing.sm}","fontSize":"{typography.size.small}","fontWeight":"{typography.weight.medium}","lineHeight":"{typography.lineHeight.control}"},
                  "header": {"fill":"{semantic.color.surface}"},
                  "headerCell": {"foreground":"{semantic.color.textSecondary}","minHeight":"{sizing.control.medium}","paddingHorizontal":"{spacing.md}","paddingVertical":"{spacing.sm}","fontSize":"{typography.size.medium}","fontWeight":"{typography.weight.medium}","lineHeight":"{typography.lineHeight.control}"},
                  "cell": {"foreground":"{semantic.color.textPrimary}","minHeight":"{sizing.control.medium}","paddingHorizontal":"{spacing.md}","paddingVertical":"{spacing.sm}","fontSize":"{typography.size.medium}","lineHeight":"{typography.lineHeight.control}"}
              },
              "sizes": {
                  "small": {"headerCell":{"minHeight":"{sizing.control.small}","paddingHorizontal":"{spacing.sm}","paddingVertical":"{spacing.xs}","fontSize":"{typography.size.small}"},"cell":{"minHeight":"{sizing.control.small}","paddingHorizontal":"{spacing.sm}","paddingVertical":"{spacing.xs}","fontSize":"{typography.size.small}"}},
                  "medium": {"headerCell":{"minHeight":"{sizing.control.medium}"},"cell":{"minHeight":"{sizing.control.medium}"}},
                  "large": {"headerCell":{"minHeight":"{sizing.control.large}","paddingHorizontal":"{spacing.lg}","paddingVertical":"{spacing.md}","fontSize":"{typography.size.large}"},"cell":{"minHeight":"{sizing.control.large}","paddingHorizontal":"{spacing.lg}","paddingVertical":"{spacing.md}","fontSize":"{typography.size.large}"}}
              },
              "variants": {
                  "plain": {"base":{"header":{"border":{"color":"{semantic.color.borderStrong}","width":"{border.width.standard}"}}}},
                  "gridlined": {"base":{"headerCell":{"border":{"color":"{semantic.color.border}","width":"{border.width.standard}"}},"cell":{"border":{"color":"{semantic.color.border}","width":"{border.width.standard}"}}}}
              }
          }

          components["data-grid"] = {
              "base": {
                  "root": {"fill":"{semantic.color.surfaceElevated}","foreground":"{semantic.color.textPrimary}","radius":"{radius.control}","border":{"color":"{semantic.color.border}","width":"{border.width.standard}"},"transition":"{motion.interaction.fast}"},
                  "header": {"fill":"{semantic.color.surface}"},
                  "columnHeader": {"foreground":"{semantic.color.textSecondary}","minHeight":"{sizing.control.medium}","paddingHorizontal":"{spacing.md}","paddingVertical":"{spacing.sm}","fontSize":"{typography.size.medium}","fontWeight":"{typography.weight.medium}","lineHeight":"{typography.lineHeight.control}"},
                  "row": {"minHeight":"{sizing.control.medium}","transition":"{motion.interaction.fast}"},
                  "cell": {"foreground":"{semantic.color.textPrimary}","paddingHorizontal":"{spacing.md}","paddingVertical":"{spacing.sm}","fontSize":"{typography.size.medium}","lineHeight":"{typography.lineHeight.control}"},
                  "selectionIndicator": {"fill":"{semantic.color.accent}","minWidth":"{component.dataGrid.selectionIndicator.width}"}
              },
              "sizes": {
                  "small": {"columnHeader":{"minHeight":"{sizing.control.small}","paddingHorizontal":"{spacing.sm}","paddingVertical":"{spacing.xs}","fontSize":"{typography.size.small}"},"row":{"minHeight":"{sizing.control.small}"},"cell":{"paddingHorizontal":"{spacing.sm}","paddingVertical":"{spacing.xs}","fontSize":"{typography.size.small}"}},
                  "medium": {"columnHeader":{"minHeight":"{sizing.control.medium}"},"row":{"minHeight":"{sizing.control.medium}"}},
                  "large": {"columnHeader":{"minHeight":"{sizing.control.large}","paddingHorizontal":"{spacing.lg}","paddingVertical":"{spacing.md}","fontSize":"{typography.size.large}"},"row":{"minHeight":"{sizing.control.large}"},"cell":{"paddingHorizontal":"{spacing.lg}","paddingVertical":"{spacing.md}","fontSize":"{typography.size.large}"}}
              },
              "states": {
                  "hover": {"row":{"fill":"{semantic.color.surface}"}},
                  "focus": {"row":{"outline":{"color":"{semantic.color.focus}","width":"{focus.ring.width}","offset":"{focus.ring.offset}"}}},
                  "pressed": {"row":{"fill":"{semantic.color.background}"}},
                  "selected": {"row":{"fill":"{semantic.color.surface}"},"selectionIndicator":{"fill":"{semantic.color.accent}"}},
                  "disabled": {"root":{"opacity":"{opacity.disabled}"}}
              }
          }
          theme_path.write_text(json.dumps(theme, separators=(",", ":")) + "\n")

          test_path = Path("scripts/test-basic-theme.mjs")
          test_source = test_path.read_text()
          old = 'const referenceComponentIds = ["button", "checkbox", "dialog", "input", "menu", "navigation", "panel", "progress", "radio", "select", "slider", "switch", "tabs", "toast", "tooltip"];'
          new = 'const referenceComponentIds = ["button", "checkbox", "data-grid", "dialog", "input", "menu", "navigation", "panel", "progress", "radio", "select", "slider", "switch", "table", "tabs", "toast", "tooltip"];'
          assert old in test_source, "Unexpected Basic reference component registry"
          test_path.write_text(test_source.replace(old, new, 1))

          budget_path = Path("spec/quality/performance-budgets.json")
          budgets = json.loads(budget_path.read_text())
          expected = {"basic":499,"modern":501,"glass":501,"frosted-glass":505,"spacey":499,"cyberpunk":501}
          updated = {"basic":597,"modern":599,"glass":599,"frosted-glass":603,"spacey":597,"cyberpunk":599}
          for theme_id, old_limit in expected.items():
              actual = budgets["themes"][theme_id]["maxResolvedVisualLeaves"]
              assert actual == old_limit, f"Unexpected {theme_id} aggregate visual budget: {actual}"
              budgets["themes"][theme_id]["maxResolvedVisualLeaves"] = updated[theme_id]
          budget_path.write_text(json.dumps(budgets, separators=(",", ":")) + "\n")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/themes/basic.theme.json scripts/test-basic-theme.mjs spec/quality/performance-budgets.json
          git diff --cached --check
          git commit -m "feat(table): add Basic table and data-grid visuals"
          git push origin HEAD:main
