name: Core CI

on:
  push:
    branches:
      - main
    # PRs always run the full Core gate. Avoid paying for the same heavy gate
    # a second time after merges that only change documentation or Dependabot policy.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'ARCHITECTURE.md'
      - 'COMPATIBILITY.md'
      - 'PUBLIC_API.md'
      - 'MIGRATION_POLICY.md'
      - 'DISTRIBUTION.md'
      - 'ROADMAP.md'
      - '.github/dependabot.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-typecheck:
    name: validate-and-typecheck
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: "2.4.10"
      COMPOSE_MULTIPLATFORM_VERSION: "1.10.3"
      PLAYWRIGHT_VERSION: "1.62.1"
      GRADLE_VERSION: "9.5.0"
      AGP_VERSION: "9.3.0"
      ANDROID_COMPILE_SDK: "37"
      ANDROID_TARGET_SDK: "37"
      ANDROID_BUILD_TOOLS: "37.0.0"
      ANDROID_PLATFORM_PACKAGE: "android-37"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate neutral specification
        run: npm run validate:spec

      - name: Compile neutral specification
        run: npm run compile:spec

      - name: Test specification compiler
        run: npm run test:spec

      - name: Guard renderer-neutral specification boundaries
        run: npm run test:neutral-boundaries

      - name: Test palette-family model
        run: npm run test:palette-model

      - name: Test theme inheritance and visual override resolution
        run: npm run test:theme-resolution

      - name: Test capability fallback resolution
        run: npm run test:capability-resolution

      - name: Test typed visual recipe resolution
        run: npm run test:visual-resolution

      - name: Test accessibility requirements
        run: npm run test:accessibility

      - name: Test Basic theme quality contract
        run: npm run test:basic-theme

      - name: Test Basic theme performance budget
        run: npm run test:basic-performance

      - name: Test Modern theme foundation contract
        run: npm run test:modern-theme

      - name: Test Modern theme performance budget
        run: npm run test:modern-performance

      - name: Test Glass theme foundation contract
        run: npm run test:glass-theme

      - name: Test Glass theme performance budget
        run: npm run test:glass-performance

      - name: Test Frosted Glass capability contract
        run: npm run test:frosted-glass-theme

      - name: Test Frosted Glass performance budget
        run: npm run test:frosted-glass-performance

      - name: Test Spacey theme foundation contract
        run: npm run test:spacey-theme

      - name: Test Spacey theme performance budget
        run: npm run test:spacey-performance

      - name: Test Cyberpunk theme foundation contract
        run: npm run test:cyberpunk-theme

      - name: Test Cyberpunk theme performance budget
        run: npm run test:cyberpunk-performance

      - name: Generate Web token output
        run: npm run build:web-tokens

      - name: Generate Web assets
        run: npm run build:web-assets

      - name: Test Web asset generation
        run: npm run test:web-assets

      - name: Test Web adapter token generation
        run: npm run test:web-adapter

      - name: Generate Web component output
        run: npm run build:web-components

      - name: Build browser extension integration bundle
        run: npm run build:browser-extension-integration

      - name: Test browser extension integration kit
        run: npm run test:browser-extension-integration

      - name: Build browser extension reference
        run: npm run build:browser-extension-reference

      - name: Test browser extension reference
        run: npm run test:browser-extension-reference

      - name: Test Web capability fallback generation
        run: npm run test:web-capabilities

      - name: Test native Web Basic Button
        run: npm run test:web-basic-button

      - name: Test native Web Basic Input
        run: npm run test:web-basic-input

      - name: Test native Web Basic Switch
        run: npm run test:web-basic-switch

      - name: Test native Web Basic Checkbox
        run: npm run test:web-basic-checkbox

      - name: Test native Web Basic Radio
        run: npm run test:web-basic-radio

      - name: Test native Web Basic Select / ComboBox
        run: npm run test:web-basic-select

      - name: Test native Web Basic Tabs
        run: npm run test:web-basic-tabs

      - name: Test native Web Basic Navigation
        run: npm run test:web-basic-navigation

      - name: Test native Web Basic Tree / Hierarchy
        run: npm run test:web-basic-tree

      - name: Test native Web Basic Form Layout
        run: npm run test:web-basic-form-layout

      - name: Test native Web Basic Scroll Container
        run: npm run test:web-basic-scroll-container

      - name: Test cross-component Web text / locale robustness
        run: npm run test:web-text-locale-robustness

      - name: Test native Web Basic Table / Data Grid
        run: npm run test:web-basic-table

      - name: Test native Web Basic Tooltip
