name: Core CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate neutral specification
        run: npm run validate:spec

      - name: Compile neutral specification
        run: npm run compile:spec

      - name: Test specification compiler
        run: npm run test:spec

      - name: Test theme inheritance and visual override resolution
        run: npm run test:theme-resolution

      - name: Test capability fallback resolution
        run: npm run test:capability-resolution

      - name: Test typed visual recipe resolution
        run: npm run test:visual-resolution

      - name: Test accessibility requirements
        run: npm run test:accessibility

      - name: Generate Web token output
        run: npm run build:web-tokens

      - name: Test Web adapter token generation
        run: npm run test:web-adapter

      - name: Generate Web component output
        run: npm run build:web-components

      - name: Test native Web Basic Button
        run: npm run test:web-button

      - name: Test native Web Basic Input
        run: npm run test:web-input

      - name: Test native Web Basic Switch
        run: npm run test:web-switch

      - name: Test native Web Basic Panel
        run: npm run test:web-panel

      - name: Test native Web Basic Dialog
        run: npm run test:web-dialog

      - name: Test functional Web reference application
        run: npm run test:web-reference

      - name: Generate Web TypeScript contracts
        run: npm run build:web-contracts

      - name: Test Web TypeScript contract generation
        run: npm run test:web-contracts

      - name: Typecheck generated Web TypeScript contracts
        run: npm run typecheck:web-contracts

      - name: Generate Kotlin contracts
        run: npm run build:kotlin-contracts

      - name: Test Kotlin contract generation
        run: npm run test:kotlin-contracts

      - name: Generate Kotlin tokens
        run: npm run build:kotlin-tokens

      - name: Test Kotlin token generation
        run: npm run test:kotlin-tokens

      - name: Generate Kotlin visual recipes
        run: npm run build:kotlin-visuals

      - name: Test Kotlin visual generation
        run: npm run test:kotlin-visuals

      - name: Test native Compose Basic Switch
        run: npm run test:kotlin-switch

      - name: Test native Compose Basic Panel
        run: npm run test:kotlin-panel

      - name: Test native Compose Basic Dialog
        run: npm run test:kotlin-dialog

      - name: Compile generated Kotlin and Compose adapter output
        run: npm run compile:kotlin-contracts

      - name: Typecheck prototype contracts
        run: npm run typecheck

  web-browser-baseline:
    if: github.event_name != 'workflow_dispatch'
    needs: validate-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install browser-test dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Compile neutral specification
        run: npm run compile:spec

      - name: Generate Web token output
        run: npm run build:web-tokens

      - name: Generate Web component output
        run: npm run build:web-components

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Verify interactions and record visual baseline candidates
        run: npm run test:web-browser:record

      - name: Upload visual baseline candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-baseline-candidates
          path: tests/browser/__snapshots__/
          if-no-files-found: error
          retention-days: 7

  record-web-baselines:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-and-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Refuse direct main baseline recording
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "Record baselines on a development branch and merge them through normal review."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned browser-test dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Compile neutral specification
        run: npm run compile:spec

      - name: Generate Web token output
        run: npm run build:web-tokens

      - name: Generate Web component output
        run: npm run build:web-components

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Record visual baselines
        run: npm run test:web-browser:record

      - name: Validate recorded PNG files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          root = Path("tests/browser/__snapshots__/web-reference.spec.mjs")
          expected = {
              "reference-dark-desktop.png": 1280,
              "reference-dialog-desktop.png": 1280,
              "reference-light-mobile.png": 390,
          }

          for name, expected_width in expected.items():
              path = root / name
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path} is not a PNG")
              width, height = struct.unpack(">II", data[16:24])
              if width != expected_width or height <= 0:
                  raise SystemExit(f"Unexpected dimensions for {path}: {width}x{height}")
              print(f"{path}: {width}x{height}, {len(data)} bytes")
          PY

      - name: Commit reproducible browser baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json tests/browser/__snapshots__/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "test(web): record CI visual baselines [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
