        run: npm run test:web-select-reference

      - name: Test standalone Web Tabs reference
        run: npm run test:web-tabs-reference

      - name: Test standalone Web Tooltip reference
        run: npm run test:web-tooltip-reference

      - name: Test standalone Web Toast / Notification reference
        run: npm run test:web-toast-reference

      - name: Test standalone Web Progress / Spinner reference
        run: npm run test:web-progress-reference

      - name: Test standalone Web Slider reference
        run: npm run test:web-slider-reference

      - name: Test standalone Web Navigation reference
        run: npm run test:web-navigation-reference

      - name: Test standalone Web Tree / Hierarchy reference
        run: npm run test:web-tree-reference

      - name: Test standalone Web Form Layout reference
        run: npm run test:web-form-layout-reference

      - name: Test standalone Web Scroll Container reference
        run: npm run test:web-scroll-container-reference

      - name: Test standalone Web text / locale reference
        run: npm run test:web-text-locale-reference

      - name: Test standalone Web Table / Data Grid reference
        run: npm run test:web-table-reference

      - name: Test standalone Web Menu / Context Menu reference
        run: npm run test:web-menu-reference

      - name: Generate Web TypeScript contracts
        run: npm run build:web-contracts

      - name: Test Web TypeScript contract generation
        run: npm run test:web-contracts

      - name: Typecheck generated Web TypeScript contracts
        run: npm run check:web-contracts

      - name: Generate Kotlin contracts
        run: npm run build:kotlin-contracts

      - name: Test Kotlin contract generation
        run: npm run test:kotlin-contracts

      - name: Generate Kotlin tokens
        run: npm run build:kotlin-tokens

      - name: Test Kotlin token generation
        run: npm run test:kotlin-tokens

      - name: Generate Kotlin visual recipes
        run: npm run build:kotlin-visuals

      - name: Test Kotlin visual generation
        run: npm run test:kotlin-visuals

      - name: Generate Kotlin assets
        run: npm run build:kotlin-assets

      - name: Test Kotlin asset generation
        run: npm run test:kotlin-assets

      - name: Test native Compose Basic Button
        run: npm run test:kotlin-basic-button

      - name: Test native Compose Basic Input
        run: npm run test:kotlin-basic-input

      - name: Test native Compose Basic Switch
        run: npm run test:kotlin-basic-switch

      - name: Test native Compose Basic Checkbox
        run: npm run test:kotlin-basic-checkbox

      - name: Test native Compose Basic Radio
        run: npm run test:kotlin-basic-radio

      - name: Test native Compose Basic Select / ComboBox
        run: npm run test:kotlin-basic-select

      - name: Test native Compose Basic Tabs
        run: npm run test:kotlin-basic-tabs

      - name: Test native Compose Basic Navigation
        run: npm run test:kotlin-basic-navigation

      - name: Test native Compose Basic Tree / Hierarchy
        run: npm run test:kotlin-basic-tree

      - name: Test native Compose Basic Form Layout
        run: npm run test:kotlin-basic-form-layout

      - name: Test native Compose Basic Scroll Container
        run: npm run test:kotlin-basic-scroll-container

      - name: Test Compose text / locale robustness
        run: npm run test:kotlin-text-locale-robustness

      - name: Test native Compose Basic Table / Data Grid
        run: npm run test:kotlin-basic-table

      - name: Test native Compose Basic Tooltip
        run: npm run test:kotlin-basic-tooltip

      - name: Test native Compose Basic Toast / Notification
        run: npm run test:kotlin-basic-toast

      - name: Test native Compose Basic Progress / Spinner
        run: npm run test:kotlin-basic-progress

      - name: Test native Compose Basic Slider
        run: npm run test:kotlin-basic-slider

      - name: Test native Compose Basic Menu / Context Menu
        run: npm run test:kotlin-basic-menu

      - name: Test native Compose Basic Panel
        run: npm run test:kotlin-basic-panel

      - name: Test native Compose Basic Dialog
        run: npm run test:kotlin-basic-dialog

      - name: Test Compose semantics and interactions
        run: npm run test:kotlin-semantics

      - name: Test Compose scaling and minimum-capability behavior
        run: npm run test:kotlin-scaling

      - name: Test Compose Desktop integration kit
        run: npm run test:desktop-integration

      - name: Test Compose Desktop reference application
        run: npm run test:desktop-reference

      - name: Test Compose Android reference source and build contract
        run: npm run test:android-reference

      - name: Test cross-platform reference application parity
        run: npm run test:reference-parity

      - name: Compile generated Kotlin and Compose adapter output
        run: npm run check:kotlin-adapter

      - name: Typecheck prototype contracts
        run: npm run check:contracts

  web-browser-regression:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[browser-ci]') || contains(github.event.head_commit.message, '[browser-ci]') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: "1.62.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Chromium
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} install chromium --with-deps

      - name: Test native Web Basic Button in Chromium
        run: npm run test:web-basic-button:browser

      - name: Test native Web Basic Input in Chromium
        run: npm run test:web-basic-input:browser

      - name: Test native Web Basic Switch in Chromium
        run: npm run test:web-basic-switch:browser

      - name: Test native Web Basic Checkbox in Chromium
        run: npm run test:web-basic-checkbox:browser

      - name: Test native Web Basic Radio in Chromium
        run: npm run test:web-basic-radio:browser

      - name: Test native Web Basic Select / ComboBox in Chromium
        run: npm run test:web-basic-select:browser

      - name: Test native Web Basic Tabs in Chromium
        run: npm run test:web-basic-tabs:browser

      - name: Test native Web Basic Navigation in Chromium
        run: npm run test:web-basic-navigation:browser

      - name: Test native Web Basic Tree / Hierarchy in Chromium
        run: npm run test:web-basic-tree:browser

      - name: Test native Web Basic Form Layout in Chromium
        run: npm run test:web-basic-form-layout:browser

      - name: Test native Web Basic Scroll Container in Chromium
        run: npm run test:web-basic-scroll-container:browser

      - name: Test cross-component Web text / locale robustness in Chromium
        run: npm run test:web-text-locale-robustness:browser

      - name: Test native Web Basic Table / Data Grid in Chromium
        run: npm run test:web-basic-table:browser

      - name: Test native Web Basic Tooltip in Chromium
        run: npm run test:web-basic-tooltip:browser

      - name: Test native Web Basic Toast / Notification in Chromium
        run: npm run test:web-basic-toast:browser

      - name: Test native Web Basic Progress / Spinner in Chromium
        run: npm run test:web-basic-progress:browser

      - name: Test native Web Basic Slider in Chromium
        run: npm run test:web-basic-slider:browser

      - name: Test native Web Basic Panel in Chromium
        run: npm run test:web-basic-panel:browser

      - name: Test native Web Basic Dialog in Chromium
        run: npm run test:web-basic-dialog:browser

      - name: Test standalone Web reference application in Chromium
        run: npm run test:web-reference:browser

      - name: Test standalone Web Select / ComboBox reference in Chromium
        run: npm run test:web-select-reference:browser

      - name: Test standalone Web Tabs reference in Chromium
        run: npm run test:web-tabs-reference:browser

      - name: Test standalone Web Tooltip reference in Chromium
        run: npm run test:web-tooltip-reference:browser

      - name: Test standalone Web Toast / Notification reference in Chromium
        run: npm run test:web-toast-reference:browser

      - name: Test standalone Web Progress / Spinner reference in Chromium
        run: npm run test:web-progress-reference:browser

      - name: Test standalone Web Slider reference in Chromium
        run: npm run test:web-slider-reference:browser

      - name: Test standalone Web Navigation reference in Chromium
        run: npm run test:web-navigation-reference:browser

      - name: Test standalone Web Tree / Hierarchy reference in Chromium
        run: npm run test:web-tree-reference:browser

      - name: Test standalone Web Form Layout reference in Chromium
        run: npm run test:web-form-layout-reference:browser

      - name: Test standalone Web Scroll Container reference in Chromium
        run: npm run test:web-scroll-container-reference:browser

      - name: Test standalone Web text / locale reference in Chromium
        run: npm run test:web-text-locale-reference:browser

      - name: Test standalone Web Table / Data Grid reference in Chromium
        run: npm run test:web-table-reference:browser

      - name: Test standalone Web Menu / Context Menu reference in Chromium
        run: npm run test:web-menu-reference:browser

      - name: Test browser-extension reference in Chromium
        run: npm run test:browser-extension-reference:browser

      - name: Test Web app integration reference in Chromium
        run: npm run test:web-application-integration:browser

  compose-android-reference:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[android-ci]') || contains(github.event.head_commit.message, '[android-ci]') }}
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "9.5.0"
      AGP_VERSION: "9.3.0"
      ANDROID_COMPILE_SDK: "37"
      ANDROID_TARGET_SDK: "37"
      ANDROID_BUILD_TOOLS: "37.0.0"
      ANDROID_PLATFORM_PACKAGE: "android-37"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;${ANDROID_PLATFORM_PACKAGE}" "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Test Compose Android reference source and build contract
        run: npm run test:android-reference

      - name: Generate Compose artifacts
        run: npm run build:compose-artifacts

      - name: Compile Compose Android reference APK
        working-directory: examples/compose-android
        run: gradle --no-daemon --stacktrace assembleDebug

  compose-android-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[device-ci]') || contains(github.event.head_commit.message, '[device-ci]') }}
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "9.5.0"
      AGP_VERSION: "9.3.0"
      ANDROID_COMPILE_SDK: "37"
      ANDROID_TARGET_SDK: "37"
      ANDROID_BUILD_TOOLS: "37.0.0"
      ANDROID_PLATFORM_PACKAGE: "android-37"
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 23
            target: default
            arch: x86_64
            ram-size: 2048M
            heap-size: 384M
            density: 320
            font-scale: 1.0
          - api-level: 35
            target: google_apis
            arch: x86_64
            ram-size: 3072M
            heap-size: 512M
            density: 440
            font-scale: 1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;${ANDROID_PLATFORM_PACKAGE}" "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Test Compose Android reference source and build contract
        run: npm run test:android-reference

      - name: Generate Compose artifacts
        run: npm run build:compose-artifacts

      - name: Run Android instrumentation smoke on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          ram-size: ${{ matrix.ram-size }}
          heap-size: ${{ matrix.heap-size }}
          sdcard-path-or-size: 128M
          disk-size: 4096M
          cores: 2
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            cd examples/compose-android
            gradle --no-daemon --stacktrace connectedDebugAndroidTest
