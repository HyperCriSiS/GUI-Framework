name: Maintenance Form Layout Contract V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair Compose gate anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/maintenance-form-layout-contract.py')
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('compose_anchor = ')]
          if len(matches) != 1:
              raise RuntimeError(f'expected one compose_anchor line, got {len(matches)}')
          lines[matches[0]] = r'''compose_anchor = '  assert.match(source, /GuiComponentSemantics\("tree", false\)/);\n\n' '''.rstrip()
          p.write_text('\n'.join(lines) + '\n')
          PY
          python -m py_compile scripts/maintenance-form-layout-contract.py
      - name: Apply Tree closure and Form Layout neutral contract
        run: python scripts/maintenance-form-layout-contract.py
      - name: Validate neutral Form Layout contract
        run: |
          npm run validate:dtcg
          npm run validate:component-contracts
          npm run compile:spec
          npm run test:spec
          npm run test:web-contracts
          npm run test:kotlin-contracts
      - name: Commit validated product changes
        run: |
          git rm -f scripts/maintenance-form-layout-contract.py .github/workflows/maintenance-form-layout-contract.yml .github/workflows/maintenance-form-layout-contract-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md spec/manifest.json spec/components/form-layout.recipe.json scripts/test-spec.mjs scripts/test-web-contracts.mjs scripts/test-compose-contracts.mjs
          git commit -m "feat(form-layout): register neutral layout primitive"
          git push
