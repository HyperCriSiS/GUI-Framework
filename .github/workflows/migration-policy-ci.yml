name: Migration Policy CI

on:
  push:
    branches:
      - main
    paths:
      - "api/migration-policy.json"
      - "api/public-api.json"
      - "MIGRATION_POLICY.md"
      - "migrations/**"
      - "distribution/artifacts.json"
      - "scripts/test-migration-policy.mjs"
  pull_request:
    paths:
      - "api/migration-policy.json"
      - "api/public-api.json"
      - "MIGRATION_POLICY.md"
      - "migrations/**"
      - "distribution/artifacts.json"
      - "scripts/test-migration-policy.mjs"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Validate versioned migration policy
        run: node scripts/test-migration-policy.mjs
