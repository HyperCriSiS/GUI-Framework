name: Maintenance Scroll Neutral Contract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Add neutral Scroll Container contract
        run: |
          cat > spec/components/scroll-container.recipe.json <<'EOF'
          {
            "specVersion": "0.1.0",
            "component": "scroll-container",
            "anatomy": [
              { "id": "root", "required": true },
              { "id": "content", "required": true }
            ],
            "content": [
              { "id": "content", "kind": "children", "required": true }
            ],
            "properties": [
              { "id": "accessibilityLabel", "type": "string", "required": false, "default": "" },
              { "id": "keyboardFocusable", "type": "boolean", "required": false, "default": true }
            ],
            "events": [],
            "variants": ["vertical", "horizontal", "both"],
            "sizes": ["small", "medium", "large"],
            "states": ["default", "focus"],
            "semantics": { "role": "scroll-container", "preferNativePrimitive": true },
            "tokenBindings": { "focus": "{semantic.color.focus}" },
            "capabilities": { "required": [], "optional": [], "fallbackOrder": ["standard", "minimal"] }
          }
          EOF
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('spec/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if not any(c['id'] == 'scroll-container' for c in manifest['components']):
              manifest['components'].append({'id':'scroll-container','source':'components/scroll-container.recipe.json'})
          manifest['components'] = sorted(manifest['components'], key=lambda c: c['id'])
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          p = Path('scripts/test-spec.mjs')
          s = p.read_text()
          old='const expectedContractComponentIds=["button","checkbox","data-grid","dialog","form-layout","input","menu","navigation","panel","progress","radio","select","slider","switch","table","tabs","toast","tooltip","tree"];'
          new='const expectedContractComponentIds=["button","checkbox","data-grid","dialog","form-layout","input","menu","navigation","panel","progress","radio","scroll-container","select","slider","switch","table","tabs","toast","tooltip","tree"];'
          if old not in s: raise SystemExit('test-spec registry anchor missing')
          p.write_text(s.replace(old,new,1))

          p = Path('scripts/test-web-contracts.mjs')
          s = p.read_text()
          old='export const guiComponentIds = \\["button", "checkbox", "data-grid", "dialog", "form-layout", "input", "menu", "navigation", "panel", "progress", "radio", "select", "slider", "switch", "table", "tabs", "toast", "tooltip", \\"tree\\"\\] as const;'
          new='export const guiComponentIds = \\["button", "checkbox", "data-grid", "dialog", "form-layout", "input", "menu", "navigation", "panel", "progress", "radio", "scroll-container", "select", "slider", "switch", "table", "tabs", "toast", "tooltip", \\"tree\\"\\] as const;'
          if old not in s: raise SystemExit('web registry anchor missing')
          s=s.replace(old,new,1)
          anchor='  assert.match(source, /export const guiSelectContract = \\{/);'
          block='  assert.match(source, /export const guiScrollContainerContract = \\{/); assert.match(source, /export type GuiScrollContainerVariant = \\(typeof guiScrollContainerContract\\.variants\\)\\[number\\];/); assert.match(source, /export type GuiScrollContainerSize = \\(typeof guiScrollContainerContract\\.sizes\\)\\[number\\];/); assert.match(source, /export type GuiScrollContainerState = \\(typeof guiScrollContainerContract\\.states\\)\\[number\\];/); assert.match(source, /variants: \\["vertical", "horizontal", "both"\\] as const,/); assert.match(source, /states: \\["default", "focus"\\] as const,/); assert.match(source, /"id": "accessibilityLabel"/); assert.match(source, /"id": "keyboardFocusable"/); assert.match(source, /"default": true/); assert.match(source, /"id": "content"/); assert.match(source, /"role": "scroll-container"/); assert.match(source, /"preferNativePrimitive": true/);\n'
          if anchor not in s: raise SystemExit('web select anchor missing')
          p.write_text(s.replace(anchor,block+anchor,1))

          p = Path('scripts/test-compose-contracts.mjs')
          s=p.read_text()
          anchor='  assert.match(source, /enum class GuiButtonVariant/);'
          if anchor not in s: raise SystemExit('compose component anchor missing')
          s=s.replace(anchor,'  assert.match(source, /SCROLL_CONTAINER\\("scroll-container"\\)/);\n\n'+anchor,1)
          anchor='  assert.match(source, /enum class GuiTooltipVariant/);'
          block='''  assert.match(source, /enum class GuiScrollContainerVariant/);\n  assert.match(source, /VERTICAL\\("vertical"\\)/);\n  assert.match(source, /HORIZONTAL\\("horizontal"\\)/);\n  assert.match(source, /BOTH\\("both"\\)/);\n  assert.match(source, /enum class GuiScrollContainerSize/);\n  assert.match(source, /enum class GuiScrollContainerState/);\n  assert.match(source, /FOCUS\\("focus"\\)/);\n  assert.match(source, /data class GuiScrollContainerProperties\\(/);\n  assert.match(source, /val accessibilityLabel: String = ""/);\n  assert.match(source, /val keyboardFocusable: Boolean = true/);\n  assert.match(source, /GuiContentSlot\\("content", "children", true\\)/);\n  assert.match(source, /GuiComponentSemantics\\("scroll-container", true\\)/);\n\n'''
          if anchor not in s: raise SystemExit('compose tooltip anchor missing')
          p.write_text(s.replace(anchor,block+anchor,1))
          PY
      - name: Validate neutral specification
        run: npm run validate:spec
      - name: Compile neutral specification
        run: npm run compile:spec
      - name: Test compiler registry
        run: npm run test:spec
      - name: Generate and test Web contracts
        run: npm run build:web-contracts && npm run test:web-contracts
      - name: Generate and test Kotlin contracts
        run: npm run build:kotlin-contracts && npm run test:kotlin-contracts
      - name: Commit validated neutral Scroll Container
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/components/scroll-container.recipe.json spec/manifest.json scripts/test-spec.mjs scripts/test-web-contracts.mjs scripts/test-compose-contracts.mjs
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'feat(scroll-container): register neutral viewport primitive'
          git push origin HEAD:main
