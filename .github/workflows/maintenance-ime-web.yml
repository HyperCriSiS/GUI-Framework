name: Maintenance IME Web
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Web editable controls and add IME gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('packages/adapter-web/src/input.mjs')
          s = path.read_text()
          s = s.replace(
            '  let props = normalizeProps(initialProps);\n\n  function render() {',
            '  let props = normalizeProps(initialProps);\n  let composing = false;\n  let lastInputValue = props.value;\n\n  function render() {'
          )
          s = s.replace(
            '    element.value = props.value;\n',
            '    if (!composing) element.value = props.value;\n'
          )
          s = s.replace(
            '''  function valueChange(event) {\n    if (props.disabled || props.readOnly) return;\n    props.onValueChange?.(event.currentTarget.value);\n  }\n\n  element.addEventListener("input", valueChange);''',
            '''  function valueChange(event) {\n    if (props.disabled || props.readOnly) return;\n    if (event.isComposing === true) composing = true;\n    lastInputValue = event.currentTarget.value;\n    props.onValueChange?.(lastInputValue);\n  }\n\n  function compositionStart() {\n    if (props.disabled || props.readOnly) return;\n    composing = true;\n  }\n\n  function compositionEnd(event) {\n    if (props.disabled || props.readOnly) {\n      composing = false;\n      return;\n    }\n    composing = false;\n    const committedValue = event.currentTarget.value;\n    queueMicrotask(() => {\n      if (props.disabled || props.readOnly || composing) return;\n      if (element.value !== committedValue || lastInputValue === committedValue) return;\n      lastInputValue = committedValue;\n      props.onValueChange?.(committedValue);\n    });\n  }\n\n  element.addEventListener("compositionstart", compositionStart);\n  element.addEventListener("compositionend", compositionEnd);\n  element.addEventListener("input", valueChange);'''
          )
          s = s.replace(
            '''    destroy() {\n      element.removeEventListener("input", valueChange);\n    },''',
            '''    destroy() {\n      element.removeEventListener("compositionstart", compositionStart);\n      element.removeEventListener("compositionend", compositionEnd);\n      element.removeEventListener("input", valueChange);\n    },'''
          )
          path.write_text(s)

          path = Path('packages/adapter-web/src/select.mjs')
          s = path.read_text()
          s = s.replace(
            '  let props = normalizeProps(initialProps);\n  let activeIndex = -1;',
            '  let props = normalizeProps(initialProps);\n  let activeIndex = -1;\n  let composing = false;\n  let lastInputQuery = props.query;'
          )
          s = s.replace(
            '    element.value = props.editable ? props.query : props.value;\n',
            '    if (!props.editable || !composing) element.value = props.editable ? props.query : props.value;\n'
          )
          s = s.replace(
            '''  function input(event) {\n    if (props.disabled || !props.editable) return;\n    props.onQueryChange?.(event.currentTarget.value);\n    if (!props.expanded) props.onExpandedChange?.(true);\n  }\n\n  function click() {''',
            '''  function input(event) {\n    if (props.disabled || !props.editable) return;\n    if (event.isComposing === true) composing = true;\n    lastInputQuery = event.currentTarget.value;\n    props.onQueryChange?.(lastInputQuery);\n    if (!props.expanded) props.onExpandedChange?.(true);\n  }\n\n  function compositionStart() {\n    if (props.disabled || !props.editable) return;\n    composing = true;\n  }\n\n  function compositionEnd(event) {\n    if (props.disabled || !props.editable) {\n      composing = false;\n      return;\n    }\n    composing = false;\n    const committedQuery = event.currentTarget.value;\n    queueMicrotask(() => {\n      if (props.disabled || !props.editable || composing) return;\n      if (element.value !== committedQuery || lastInputQuery === committedQuery) return;\n      lastInputQuery = committedQuery;\n      props.onQueryChange?.(committedQuery);\n      if (!props.expanded) props.onExpandedChange?.(true);\n    });\n  }\n\n  function click() {'''
          )
          s = s.replace(
            '''  function keydown(event) {\n    if (props.disabled) return;\n    if (event.key === "ArrowDown" || event.key === "ArrowUp") {''',
            '''  function keydown(event) {\n    if (props.disabled) return;\n    if (props.editable && (composing || event.isComposing === true || event.keyCode === 229)) return;\n    if (event.key === "ArrowDown" || event.key === "ArrowUp") {'''
          )
          s = s.replace(
            '''  element.addEventListener("input", input);\n  element.addEventListener("click", click);''',
            '''  element.addEventListener("compositionstart", compositionStart);\n  element.addEventListener("compositionend", compositionEnd);\n  element.addEventListener("input", input);\n  element.addEventListener("click", click);'''
          )
          s = s.replace(
            '''    destroy() {\n      element.removeEventListener("input", input);\n      element.removeEventListener("click", click);''',
            '''    destroy() {\n      element.removeEventListener("compositionstart", compositionStart);\n      element.removeEventListener("compositionend", compositionEnd);\n      element.removeEventListener("input", input);\n      element.removeEventListener("click", click);'''
          )
          path.write_text(s)

          Path('scripts/test-web-ime-composition.mjs').write_bytes(base64.b64decode(''))
          PY
      - name: Validate source syntax
        run: |
          node --check packages/adapter-web/src/input.mjs
          node --check packages/adapter-web/src/select.mjs
          node --check scripts/test-web-ime-composition.mjs
      - name: Run existing Web editable-control gates
        run: |
          node scripts/test-web-input.mjs
          node scripts/test-web-select.mjs
      - name: Run Web IME composition gate
        run: node scripts/test-web-ime-composition.mjs
      - name: Commit validated Web IME slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapter-web/src/input.mjs packages/adapter-web/src/select.mjs scripts/test-web-ime-composition.mjs
          git commit -m "fix(ime): preserve Web composition sessions"
          git push
