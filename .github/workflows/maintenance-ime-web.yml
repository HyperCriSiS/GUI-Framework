name: Maintenance IME Web
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Web editable controls and temporary IME regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('packages/adapter-web/src/input.mjs')
          s = p.read_text()
          s = s.replace(
            '  let props = normalizeProps(initialProps);\n\n  function render() {',
            '  let props = normalizeProps(initialProps);\n  let composing = false;\n  let lastInputValue = props.value;\n\n  function render() {'
          )
          s = s.replace('    element.value = props.value;\n', '    if (!composing) element.value = props.value;\n')
          s = s.replace(
            '''  function valueChange(event) {\n    if (props.disabled || props.readOnly) return;\n    props.onValueChange?.(event.currentTarget.value);\n  }\n\n  element.addEventListener("input", valueChange);''',
            '''  function valueChange(event) {\n    if (props.disabled || props.readOnly) return;\n    if (event.isComposing === true) composing = true;\n    lastInputValue = event.currentTarget.value;\n    props.onValueChange?.(lastInputValue);\n  }\n\n  function compositionStart() {\n    if (props.disabled || props.readOnly) return;\n    composing = true;\n  }\n\n  function compositionEnd(event) {\n    if (props.disabled || props.readOnly) {\n      composing = false;\n      return;\n    }\n    composing = false;\n    const committedValue = event.currentTarget.value;\n    queueMicrotask(() => {\n      if (props.disabled || props.readOnly || composing) return;\n      if (element.value !== committedValue || lastInputValue === committedValue) return;\n      lastInputValue = committedValue;\n      props.onValueChange?.(committedValue);\n    });\n  }\n\n  element.addEventListener("compositionstart", compositionStart);\n  element.addEventListener("compositionend", compositionEnd);\n  element.addEventListener("input", valueChange);'''
          )
          s = s.replace(
            '''    destroy() {\n      element.removeEventListener("input", valueChange);\n    },''',
            '''    destroy() {\n      element.removeEventListener("compositionstart", compositionStart);\n      element.removeEventListener("compositionend", compositionEnd);\n      element.removeEventListener("input", valueChange);\n    },'''
          )
          p.write_text(s)

          p = Path('packages/adapter-web/src/select.mjs')
          s = p.read_text()
          s = s.replace(
            '  let props = normalizeProps(initialProps);\n  let activeIndex = -1;',
            '  let props = normalizeProps(initialProps);\n  let activeIndex = -1;\n  let composing = false;\n  let lastInputQuery = props.query;'
          )
          s = s.replace(
            '    element.value = props.editable ? props.query : props.value;\n',
            '    if (!props.editable || !composing) element.value = props.editable ? props.query : props.value;\n'
          )
          s = s.replace(
            '''  function input(event) {\n    if (props.disabled || !props.editable) return;\n    props.onQueryChange?.(event.currentTarget.value);\n    if (!props.expanded) props.onExpandedChange?.(true);\n  }\n\n  function click() {''',
            '''  function input(event) {\n    if (props.disabled || !props.editable) return;\n    if (event.isComposing === true) composing = true;\n    lastInputQuery = event.currentTarget.value;\n    props.onQueryChange?.(lastInputQuery);\n    if (!props.expanded) props.onExpandedChange?.(true);\n  }\n\n  function compositionStart() {\n    if (props.disabled || !props.editable) return;\n    composing = true;\n  }\n\n  function compositionEnd(event) {\n    if (props.disabled || !props.editable) {\n      composing = false;\n      return;\n    }\n    composing = false;\n    const committedQuery = event.currentTarget.value;\n    queueMicrotask(() => {\n      if (props.disabled || !props.editable || composing) return;\n      if (element.value !== committedQuery || lastInputQuery === committedQuery) return;\n      lastInputQuery = committedQuery;\n      props.onQueryChange?.(committedQuery);\n      if (!props.expanded) props.onExpandedChange?.(true);\n    });\n  }\n\n  function click() {'''
          )
          s = s.replace(
            '''  function keydown(event) {\n    if (props.disabled) return;\n    if (event.key === "ArrowDown" || event.key === "ArrowUp") {''',
            '''  function keydown(event) {\n    if (props.disabled) return;\n    if (props.editable && (composing || event.isComposing === true || event.keyCode === 229)) return;\n    if (event.key === "ArrowDown" || event.key === "ArrowUp") {'''
          )
          s = s.replace(
            '''  element.addEventListener("input", input);\n  element.addEventListener("click", click);''',
            '''  element.addEventListener("compositionstart", compositionStart);\n  element.addEventListener("compositionend", compositionEnd);\n  element.addEventListener("input", input);\n  element.addEventListener("click", click);'''
          )
          s = s.replace(
            '''    destroy() {\n      element.removeEventListener("input", input);\n      element.removeEventListener("click", click);''',
            '''    destroy() {\n      element.removeEventListener("compositionstart", compositionStart);\n      element.removeEventListener("compositionend", compositionEnd);\n      element.removeEventListener("input", input);\n      element.removeEventListener("click", click);'''
          )
          p.write_text(s)

          p = Path('scripts/test-web-input.mjs')
          s = p.read_text()
          s = s.replace(
            '''  input(value) {\n    this.value = value;\n    this.listeners.get("input")?.({ type: "input", currentTarget: this });\n  }''',
            '''  input(value, isComposing = false) {\n    this.value = value;\n    this.listeners.get("input")?.({ type: "input", currentTarget: this, isComposing });\n  }\n  compositionStart() { this.listeners.get("compositionstart")?.({ type: "compositionstart", currentTarget: this }); }\n  compositionEnd() { this.listeners.get("compositionend")?.({ type: "compositionend", currentTarget: this }); }'''
          )
          marker = '  input.destroy();\n'
          regression = '''  const imeChanges = [];\n  const imeInput = createGuiInput(fakeDocument, { value: "seed", onValueChange(value) { imeChanges.push(value); } });\n  imeInput.element.compositionStart();\n  imeInput.element.input("に", true);\n  imeInput.update({ value: "seed" });\n  assert.equal(imeInput.element.value, "に", "Controlled rerenders must not overwrite active IME preedit");\n  imeInput.element.input("日本", true);\n  imeInput.update({ value: "に" });\n  assert.equal(imeInput.element.value, "日本");\n  imeInput.element.compositionEnd();\n  await Promise.resolve();\n  assert.deepEqual(imeChanges, ["に", "日本"], "compositionend must not duplicate an observed final input value");\n  imeInput.update({ value: "日本" });\n  imeInput.element.compositionStart();\n  imeInput.element.value = "日本語";\n  imeInput.element.compositionEnd();\n  await Promise.resolve();\n  assert.deepEqual(imeChanges, ["に", "日本", "日本語"], "compositionend must recover a committed value when final input is omitted");\n  imeInput.update({ value: "server-reset" });\n  assert.equal(imeInput.element.value, "server-reset", "Controlled reconciliation must resume after composition");\n  imeInput.destroy();\n  assert.equal(imeInput.element.listeners.has("compositionstart"), false);\n  assert.equal(imeInput.element.listeners.has("compositionend"), false);\n\n'''
          s = s.replace(marker, regression + marker)
          p.write_text(s)

          p = Path('scripts/test-web-select.mjs')
          s = p.read_text()
          s = s.replace(
            '''  input(value) { this.value = value; this.listeners.get("input")?.({ type: "input", currentTarget: this, target: this }); }\n  keydown(key) {\n    let prevented = false;\n    this.listeners.get("keydown")?.({ type: "keydown", key, currentTarget: this, target: this, preventDefault() { prevented = true; } });\n    return prevented;\n  }''',
            '''  input(value, isComposing = false) { this.value = value; this.listeners.get("input")?.({ type: "input", currentTarget: this, target: this, isComposing }); }\n  compositionStart() { this.listeners.get("compositionstart")?.({ type: "compositionstart", currentTarget: this, target: this }); }\n  compositionEnd() { this.listeners.get("compositionend")?.({ type: "compositionend", currentTarget: this, target: this }); }\n  keydown(key, { isComposing = false, keyCode = 0 } = {}) {\n    let prevented = false;\n    this.listeners.get("keydown")?.({ type: "keydown", key, keyCode, isComposing, currentTarget: this, target: this, preventDefault() { prevented = true; } });\n    return prevented;\n  }'''
          )
          marker = '  disabled.destroy(); modern.destroy(); basic.destroy(); select.destroy();\n'
          regression = '''  const imeQueries = [];\n  const imeValues = [];\n  const imeExpanded = [];\n  const imeSelect = createGuiSelect(fakeDocument, { value: "", query: "seed", editable: true, expanded: true, onQueryChange(value) { imeQueries.push(value); }, onValueChange(value) { imeValues.push(value); }, onExpandedChange(value) { imeExpanded.push(value); } });\n  const imeOption = createGuiSelectOption(fakeDocument, { value: "jp", label: "日本語" });\n  imeSelect.popupElement.append(imeOption.element);\n  imeSelect.refreshOptions();\n  imeSelect.element.compositionStart();\n  imeSelect.element.input("か", true);\n  imeSelect.update({ query: "seed" });\n  assert.equal(imeSelect.element.value, "か", "Editable ComboBox preedit must survive stale query rerenders");\n  assert.equal(imeSelect.element.keydown("Enter", { isComposing: true, keyCode: 229 }), false, "IME Enter must not be consumed");\n  assert.equal(imeSelect.element.keydown("ArrowDown", { isComposing: true, keyCode: 229 }), false, "IME arrows must remain available to the candidate UI");\n  assert.deepEqual(imeValues, []);\n  imeSelect.element.input("かな", true);\n  imeSelect.update({ query: "か" });\n  assert.equal(imeSelect.element.value, "かな");\n  imeSelect.element.compositionEnd();\n  await Promise.resolve();\n  assert.deepEqual(imeQueries, ["か", "かな"]);\n  imeSelect.update({ query: "かな" });\n  assert.equal(imeSelect.element.keydown("Enter", { keyCode: 229 }), false, "Legacy process key 229 must not commit an option");\n  assert.deepEqual(imeValues, []);\n  assert.equal(imeSelect.element.keydown("Enter"), true, "Normal Enter handling must resume after composition");\n  assert.deepEqual(imeValues, ["jp"]);\n  assert.deepEqual(imeExpanded, [false]);\n  imeOption.destroy();\n  imeSelect.destroy();\n  assert.equal(imeSelect.element.listeners.has("compositionstart"), false);\n  assert.equal(imeSelect.element.listeners.has("compositionend"), false);\n\n'''
          s = s.replace(marker, regression + marker)
          p.write_text(s)
          PY
      - name: Validate patched source and harness syntax
        run: |
          node --check packages/adapter-web/src/input.mjs
          node --check packages/adapter-web/src/select.mjs
          node --check scripts/test-web-input.mjs
          node --check scripts/test-web-select.mjs
      - name: Run existing plus temporary IME regressions
        run: |
          node scripts/test-web-input.mjs
          node scripts/test-web-select.mjs
      - name: Commit validated Web IME adapter slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- scripts/test-web-input.mjs scripts/test-web-select.mjs
          git add packages/adapter-web/src/input.mjs packages/adapter-web/src/select.mjs
          git commit -m "fix(ime): preserve Web composition sessions"
          git push
