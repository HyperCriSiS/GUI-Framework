name: Maintenance Table Double Click Window

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic Table double-click window patch
        run: python scripts/maintenance-table-double-click-window.py
      - name: Gate Compose Table source
        run: node scripts/test-compose-table.mjs
      - name: Commit product changes and remove maintenance helpers
        run: |
          rm scripts/maintenance-table-double-click-window.py
          rm .github/workflows/maintenance-table-double-click-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(table): accept rapid consecutive row activation [android-ci] [device-ci]"
          git push
