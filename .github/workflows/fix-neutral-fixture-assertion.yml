name: One-shot repair neutral fixture assertion

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/showcase-theme-gallery' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: fix/showcase-theme-gallery
          fetch-depth: 0
      - name: Repair assertion and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-compose-android-reference.mjs')
          source = path.read_text()
          old = 'assert.doesNotMatch(source, /demo@example\\.invalid/i, "Android reference fixtures must not contain personalized user data");'
          new = 'assert.doesNotMatch(source, /@example\\.com/i, "Android reference fixtures must use reserved neutral identity domains");'
          if old not in source:
              raise SystemExit('Expected stale neutral-fixture assertion was not found')
          path.write_text(source.replace(old, new))
          PY
          git rm .github/workflows/fix-neutral-fixture-assertion.yml
          if git grep -n -i 'jan@example'; then
            echo 'Personalized fixture reference still present.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(android): assert reserved neutral identity domain'
          git push origin HEAD:fix/showcase-theme-gallery
