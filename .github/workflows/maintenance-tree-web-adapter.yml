name: Maintenance Tree Web Adapter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Gate native Web Tree adapter
        run: node scripts/test-web-tree.mjs
      - name: Remove maintenance workflow and record gate
        run: |
          rm .github/workflows/maintenance-tree-web-adapter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(tree): gate native Web hierarchy adapter"
          git push
