name: Maintenance Tree Basic Visual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Align Tree functional interaction contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/maintenance-tree-basic-visual.py')
          source = path.read_text()
          old = '            "paddingVertical": "{spacing.xs}",\n            "border": {"color": "{semantic.color.border}", "width": "{border.width.standard}"},\n'
          new = '            "paddingVertical": "{spacing.xs}",\n            "border": {"color": "{semantic.color.border}", "width": "{border.width.standard}"},\n            "transition": "{motion.interaction.fast}",\n'
          if old not in source:
              raise RuntimeError('Tree root visual anchor missing')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Apply deterministic Tree Basic visual patch
        run: python scripts/maintenance-tree-basic-visual.py
      - name: Validate Tree Basic visual contract
        run: |
          node scripts/validate-dtcg.mjs
          npm run compile:spec
          node scripts/test-spec.mjs
          node scripts/test-basic-theme.mjs
          node scripts/test-basic-performance.mjs
          node scripts/test-modern-performance.mjs
          node scripts/test-glass-performance.mjs
          node scripts/test-frosted-performance.mjs
          node scripts/test-spacey-performance.mjs
          node scripts/test-cyberpunk-performance.mjs
          node scripts/test-web-adapter.mjs
          node scripts/test-compose-tokens.mjs
      - name: Commit product changes and remove maintenance helpers
        run: |
          rm scripts/maintenance-tree-basic-visual.py
          rm .github/workflows/maintenance-tree-basic-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(tree): add Basic hierarchy visuals"
          git push
