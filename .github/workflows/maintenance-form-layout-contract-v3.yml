name: Maintenance Form Layout Contract V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply neutral contract except Compose gate
        run: |
          python scripts/maintenance-form-layout-contract.py || true
          python - <<'PY'
          from pathlib import Path
          import json
          assert Path('spec/components/form-layout.recipe.json').exists()
          assert any(c['id'] == 'form-layout' for c in json.loads(Path('spec/manifest.json').read_text())['components'])
          assert '"form-layout"' in Path('scripts/test-spec.mjs').read_text()
          assert 'guiFormLayoutContract' in Path('scripts/test-web-contracts.mjs').read_text()
          PY
      - name: Add Compose generated-contract gate robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-compose-contracts.mjs')
          text = p.read_text()
          if 'GuiFormLayoutVariant' in text:
              raise RuntimeError('Form Layout Compose gate already present')
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if 'GuiComponentSemantics' in line and 'tree' in line]
          if len(matches) != 1:
              raise RuntimeError(f'expected one Tree semantics gate, got {len(matches)}')
          block = [
              '',
              '  assert.match(source, /enum class GuiFormLayoutVariant/);',
              '  assert.match(source, /STACKED\\("stacked"\\)/);',
              '  assert.match(source, /INLINE\\("inline"\\)/);',
              '  assert.match(source, /enum class GuiFormLayoutSize/);',
              '  assert.match(source, /enum class GuiFormLayoutState/);',
              '  assert.match(source, /ERROR\\("error"\\)/);',
              '  assert.match(source, /DISABLED\\("disabled"\\)/);',
              '  assert.match(source, /data class GuiFormLayoutProperties\\(/);',
              '  assert.match(source, /val accessibilityLabel: String = ""/);',
              '  assert.match(source, /val columns: Double = 1\\.0/);',
              '  assert.match(source, /GuiContentSlot\\("section", "children", false\\)/);',
              '  assert.match(source, /GuiContentSlot\\("field", "children", true\\)/);',
              '  assert.match(source, /GuiContentSlot\\("label", "text", false\\)/);',
              '  assert.match(source, /GuiContentSlot\\("control", "children", true\\)/);',
              '  assert.match(source, /GuiContentSlot\\("description", "text", false\\)/);',
              '  assert.match(source, /GuiContentSlot\\("error", "text", false\\)/);',
              '  assert.match(source, /GuiContentSlot\\("actions", "children", false\\)/);',
              '  assert.match(source, /GuiComponentSemantics\\("group", false\\)/);',
          ]
          at = matches[0] + 1
          lines[at:at] = block
          p.write_text('\n'.join(lines) + '\n')
          PY
          node --check scripts/test-compose-contracts.mjs
      - name: Validate neutral Form Layout contract
        run: |
          npm run validate:dtcg
          npm run validate:component-contracts
          npm run compile:spec
          npm run test:spec
          npm run test:web-contracts
          npm run test:kotlin-contracts
      - name: Commit validated product changes
        run: |
          git rm -f scripts/maintenance-form-layout-contract.py .github/workflows/maintenance-form-layout-contract.yml .github/workflows/maintenance-form-layout-contract-v2.yml .github/workflows/maintenance-form-layout-contract-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md spec/manifest.json spec/components/form-layout.recipe.json scripts/test-spec.mjs scripts/test-web-contracts.mjs scripts/test-compose-contracts.mjs
          git commit -m "feat(form-layout): register neutral layout primitive"
          git push
