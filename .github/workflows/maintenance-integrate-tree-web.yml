name: Maintenance Integrate Tree Web
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Tree Web integration
        run: python scripts/maintenance-integrate-tree-web.py
      - name: Validate Tree Web integration
        run: |
          npm run validate:dtcg
          npm run compile:spec
          npm run test:spec
          npm run test:basic-theme
          npm run test:web-tree
          npm run test:web-adapter
          npm run test:web-capabilities
      - name: Commit product changes and remove maintenance helpers
        run: |
          git rm scripts/maintenance-integrate-tree-web.py .github/workflows/maintenance-integrate-tree-web.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md package.json packages/adapter-web/src/generate-components-css.mjs scripts/test-web-tree.mjs
          git commit -m "feat(tree): integrate Web hierarchy styling"
          git push
