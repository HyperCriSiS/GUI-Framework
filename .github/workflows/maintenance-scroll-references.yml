name: Maintenance Scroll References

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Integrate Scroll Container references and runtime contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          desktop_path = Path('examples/compose-desktop/src/main/kotlin/Main.kt')
          desktop = desktop_path.read_text()
          replacements = [
              ('import androidx.compose.foundation.layout.Arrangement\n', 'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.layout.Arrangement\n'),
              ('import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.height\n'),
              ('import gui.framework.compose.GuiFormLayoutSection\n', 'import gui.framework.compose.GuiFormLayoutSection\nimport gui.framework.compose.GuiScrollContainer\n'),
              ('import gui.framework.generated.internal.GuiFormLayoutVariant\n', 'import gui.framework.generated.internal.GuiFormLayoutVariant\nimport gui.framework.generated.internal.GuiScrollContainerSize\nimport gui.framework.generated.internal.GuiScrollContainerVariant\n'),
              ('    var formSaveCount by remember { mutableStateOf(0) }\n    var tableGridValue', '    var formSaveCount by remember { mutableStateOf(0) }\n    val activityScrollState = rememberScrollState()\n    var tableGridValue'),
              ('    val formLayoutSize = if (density == ReferenceDensity.Compact) GuiFormLayoutSize.SMALL else GuiFormLayoutSize.MEDIUM\n', '    val formLayoutSize = if (density == ReferenceDensity.Compact) GuiFormLayoutSize.SMALL else GuiFormLayoutSize.MEDIUM\n    val scrollContainerSize = if (density == ReferenceDensity.Compact) GuiScrollContainerSize.SMALL else GuiScrollContainerSize.MEDIUM\n'),
          ]
          for old, new in replacements:
              if old not in desktop:
                  raise SystemExit(f'Desktop anchor not found: {old!r}')
              desktop = desktop.replace(old, new, 1)
          scroll_block = '''                val activityItems = listOf(\n                    "Activity event 01",\n                    "Activity event 02",\n                    "Activity event 03",\n                    "Activity event 04",\n                    "Activity event 05",\n                    "Activity event 06",\n                    "Activity event 07",\n                    "Activity event 08",\n                    "Activity event 09",\n                    "Activity event 10",\n                    "Activity event 11",\n                    "Activity event 12",\n                )\n                GuiScrollContainer(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .height(if (density == ReferenceDensity.Compact) 144.dp else 176.dp),\n                    variant = GuiScrollContainerVariant.VERTICAL,\n                    size = scrollContainerSize,\n                    accessibilityLabel = "Activity log viewport",\n                    keyboardFocusable = true,\n                    verticalScrollState = activityScrollState,\n                ) {\n                    Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                        activityItems.forEach { BasicText(it) }\n                    }\n                }\n                BasicText("Scroll offset: ${activityScrollState.value}")\n'''
          anchor = '                val tableColumns = listOf(\n'
          if anchor not in desktop:
              raise SystemExit('Desktop table anchor not found')
          desktop = desktop.replace(anchor, scroll_block + anchor, 1)
          desktop_path.write_text(desktop)

          android_path = Path('examples/compose-android/app/src/main/kotlin/gui/framework/examples/android/MainActivity.kt')
          android = android_path.read_text()
          replacements = [
              ('import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.height\n'),
              ('import gui.framework.compose.GuiFormLayoutSection\n', 'import gui.framework.compose.GuiFormLayoutSection\nimport gui.framework.compose.GuiScrollContainer\n'),
              ('import gui.framework.generated.internal.GuiFormLayoutVariant\n', 'import gui.framework.generated.internal.GuiFormLayoutVariant\nimport gui.framework.generated.internal.GuiScrollContainerSize\nimport gui.framework.generated.internal.GuiScrollContainerVariant\n'),
              ('    var formSaveCount by remember { mutableStateOf(0) }\n    var tableGridValue', '    var formSaveCount by remember { mutableStateOf(0) }\n    val activityScrollState = rememberScrollState()\n    var tableGridValue'),
              ('    val formLayoutSize = if (density == ReferenceDensity.Compact) GuiFormLayoutSize.SMALL else GuiFormLayoutSize.MEDIUM\n', '    val formLayoutSize = if (density == ReferenceDensity.Compact) GuiFormLayoutSize.SMALL else GuiFormLayoutSize.MEDIUM\n    val scrollContainerSize = if (density == ReferenceDensity.Compact) GuiScrollContainerSize.SMALL else GuiScrollContainerSize.MEDIUM\n'),
          ]
          for old, new in replacements:
              if old not in android:
                  raise SystemExit(f'Android anchor not found: {old!r}')
              android = android.replace(old, new, 1)
          if anchor not in android:
              raise SystemExit('Android table anchor not found')
          android = android.replace(anchor, scroll_block + anchor, 1)
          android_path.write_text(android)

          runtime_path = Path('examples/compose-android/app/src/androidTest/kotlin/gui/framework/examples/android/ReferenceRuntimeTest.kt')
          runtime = runtime_path.read_text()
          table_anchor = '''            composeRule.onNodeWithContentDescription("Project inventory table")\n                .performScrollTo()\n                .assertIsDisplayed()\n'''
          runtime_block = '''            val activityViewport = composeRule.onNodeWithContentDescription("Activity log viewport")\n            activityViewport.performScrollTo().assertIsDisplayed()\n            composeRule.onNodeWithText("Scroll offset: 0").performScrollTo().assertIsDisplayed()\n            activityViewport.performSemanticsAction(SemanticsActions.ScrollBy) { scrollBy ->\n                scrollBy(0f, 500f)\n            }\n            composeRule.waitForIdle()\n            composeRule.onNodeWithText("Scroll offset: 0").assertDoesNotExist()\n            composeRule.onNodeWithText("Activity event 12").assertIsDisplayed()\n\n'''
          if table_anchor not in runtime:
              raise SystemExit('Runtime table anchor not found')
          runtime = runtime.replace(table_anchor, runtime_block + table_anchor, 1)
          runtime_path.write_text(runtime)

          scenario_path = Path('examples/reference-scenarios.json')
          scenario = json.loads(scenario_path.read_text())
          scenario['phase6ScrollContainer'] = {
              'variant': 'vertical',
              'accessibilityLabel': 'Activity log viewport',
              'keyboardFocusable': True,
              'items': [f'Activity event {i:02d}' for i in range(1, 13)],
              'targetItem': 'Activity event 12',
              'hostOwnsOffset': True,
          }
          scenario_path.write_text(json.dumps(scenario, indent=2) + '\n')

          desktop_gate_path = Path('scripts/test-compose-desktop-reference.mjs')
          gate = desktop_gate_path.read_text()
          marker = 'console.log("Compose Desktop reference application source contract tests passed with Basic Checkbox/Radio/Select/Tabs/Tooltip/Toast/Progress/Slider/Navigation/Form Layout/Menu coverage and Phase 5 theme selection isolation.");'
          additions = '''assert.match(source, /GuiScrollContainerSize\\.SMALL/);\nassert.match(source, /val activityScrollState = rememberScrollState\\(\\)/);\nassert.match(source, /GuiScrollContainer\\(/);\nassert.match(source, /variant = GuiScrollContainerVariant\\.VERTICAL/);\nassert.match(source, /accessibilityLabel = "Activity log viewport"/);\nassert.match(source, /keyboardFocusable = true/);\nassert.match(source, /verticalScrollState = activityScrollState/);\nassert.match(source, /Activity event 12/);\nassert.match(source, /Scroll offset: \\$\\{activityScrollState\\.value\\}/);\nassert.match(source, /\\.height\\(if \\(density == ReferenceDensity\\.Compact\\) 144\\.dp else 176\\.dp\\)/);\nconsole.log("Compose Desktop reference application source contract tests passed with Basic Checkbox/Radio/Select/Tabs/Tooltip/Toast/Progress/Slider/Navigation/Form Layout/Scroll Container/Menu coverage and Phase 5 theme selection isolation.");'''
          if marker not in gate:
              raise SystemExit('Desktop gate marker not found')
          desktop_gate_path.write_text(gate.replace(marker, additions, 1))

          android_gate_path = Path('scripts/test-compose-android-reference.mjs')
          gate = android_gate_path.read_text()
          marker = 'console.log("Compose Android reference application source/build/runtime contract tests passed with Basic Checkbox/Radio/Select/Tabs/Tooltip/Toast/Progress/Slider/Navigation/Form Layout/Menu coverage and Phase 5 theme selection isolation.");'
          additions = '''assert.match(source, /GuiScrollContainerSize\\.SMALL/);\nassert.match(source, /val activityScrollState = rememberScrollState\\(\\)/);\nassert.match(source, /GuiScrollContainer\\(/);\nassert.match(source, /variant = GuiScrollContainerVariant\\.VERTICAL/);\nassert.match(source, /accessibilityLabel = "Activity log viewport"/);\nassert.match(source, /keyboardFocusable = true/);\nassert.match(source, /verticalScrollState = activityScrollState/);\nassert.match(source, /Activity event 12/);\nassert.match(source, /Scroll offset: \\$\\{activityScrollState\\.value\\}/);\nassert.match(runtimeTest, /onNodeWithContentDescription\\("Activity log viewport"\\)/);\nassert.match(runtimeTest, /performSemanticsAction\\(SemanticsActions\\.ScrollBy\\)/);\nassert.match(runtimeTest, /scrollBy\\(0f, 500f\\)/);\nassert.match(runtimeTest, /onNodeWithText\\("Scroll offset: 0"\\)\\.assertDoesNotExist\\(\\)/);\nassert.match(runtimeTest, /onNodeWithText\\("Activity event 12"\\)\\.assertIsDisplayed\\(\\)/);\nconsole.log("Compose Android reference application source/build/runtime contract tests passed with Basic Checkbox/Radio/Select/Tabs/Tooltip/Toast/Progress/Slider/Navigation/Form Layout/Scroll Container/Menu coverage and Phase 5 theme selection isolation.");'''
          if marker not in gate:
              raise SystemExit('Android gate marker not found')
          android_gate_path.write_text(gate.replace(marker, additions, 1))

          parity_path = Path('scripts/test-reference-parity.mjs')
          parity = parity_path.read_text()
          marker = 'console.log("Cross-platform reference application parity tests passed with Basic Checkbox/Radio/Select/Tabs/Tooltip/Toast/Progress/Slider/Navigation/Form Layout/Table/Data Grid/Menu extensions and validated Modern/Glass/Frosted/Spacey/Cyberpunk selection paths.");'
          additions = '''const webScrollContainer = await readFile("examples/web-reference/scroll-container-reference.mjs", "utf8");\nassert.deepEqual(scenario.phase6ScrollContainer, {\n  variant: "vertical",\n  accessibilityLabel: "Activity log viewport",\n  keyboardFocusable: true,\n  items: Array.from({ length: 12 }, (_, index) => `Activity event ${String(index + 1).padStart(2, "0")}`),\n  targetItem: "Activity event 12",\n  hostOwnsOffset: true,\n});\nassert.match(webScrollContainer, /createGuiScrollContainer/);\nassert.match(webScrollContainer, /accessibilityLabel: "Activity log viewport"/);\nassert.match(webScrollContainer, /variant: "vertical"/);\nassert.match(webScrollContainer, /viewport\\.update\\(\\{ keyboardFocusable \\}\\)/);\nassert.match(webScrollContainer, /viewport\\.element\\.scrollTop/);\nfor (const [name, source] of [["Desktop", desktop], ["Android", android]]) {\n  assert.match(source, /GuiScrollContainerSize\\.SMALL/, `${name} compact reference must map Scroll Container to SMALL`);\n  assert.match(source, /val activityScrollState = rememberScrollState\\(\\)/, `${name} must expose caller-owned ScrollState`);\n  assert.match(source, /GuiScrollContainer\\(/, `${name} must exercise GuiScrollContainer`);\n  assert.match(source, /variant = GuiScrollContainerVariant\\.VERTICAL/, `${name} must expose vertical Scroll Container parity`);\n  assert.match(source, /accessibilityLabel = "Activity log viewport"/, `${name} must expose Scroll Container semantics`);\n  assert.match(source, /keyboardFocusable = true/, `${name} must expose keyboard focusability`);\n  assert.match(source, /verticalScrollState = activityScrollState/, `${name} must pass host-owned scroll state`);\n  assert.match(source, /Activity event 12/, `${name} must expose the shared terminal activity item`);\n  assert.match(source, /Scroll offset: \\$\\{activityScrollState\\.value\\}/, `${name} must surface host-owned offset`);\n}\nconsole.log("Cross-platform reference application parity tests passed with Basic Checkbox/Radio/Select/Tabs/Tooltip/Toast/Progress/Slider/Navigation/Form Layout/Scroll Container/Table/Data Grid/Menu extensions and validated Modern/Glass/Frosted/Spacey/Cyberpunk selection paths.");'''
          if marker not in parity:
              raise SystemExit('Parity marker not found')
          parity_path.write_text(parity.replace(marker, additions, 1))
          PY
      - name: Validate source and parity gates
        run: |
          npm run test:kotlin-desktop-reference
          npm run test:kotlin-android-reference
          npm run test:reference-parity
      - name: Generate Kotlin inputs
        run: |
          npm run compile:spec
          npm run build:kotlin-contracts
          npm run build:kotlin-tokens
          npm run build:kotlin-visuals
          npm run build:kotlin-assets
      - name: Compile Compose adapter and references
        run: |
          npm run compile:kotlin-contracts
          gradle --no-daemon --stacktrace --console=plain -p examples/compose-android compileDebugKotlin compileDebugAndroidTestKotlin
      - name: Commit validated Scroll Container references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/compose-desktop/src/main/kotlin/Main.kt \
            examples/compose-android/app/src/main/kotlin/gui/framework/examples/android/MainActivity.kt \
            examples/compose-android/app/src/androidTest/kotlin/gui/framework/examples/android/ReferenceRuntimeTest.kt \
            examples/reference-scenarios.json \
            scripts/test-compose-desktop-reference.mjs \
            scripts/test-compose-android-reference.mjs \
            scripts/test-reference-parity.mjs
          git commit -m "test(scroll-container): integrate Compose references and runtime parity [android-ci] [device-ci]"
          git push origin HEAD:main
