name: Maintenance Form Layout Visual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Basic Form Layout visual
        run: python scripts/maintenance-form-layout-visual.py
      - name: Validate Basic visual and generated output
        run: |
          npm run validate:dtcg
          npm run compile:spec
          npm run test:spec
          npm run test:basic-theme
          npm run test:basic-performance
          npm run build:web-components
          npm run test:web-adapter
      - name: Commit validated product changes
        run: |
          git rm -f scripts/maintenance-form-layout-visual.py .github/workflows/maintenance-form-layout-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/themes/basic.theme.json scripts/test-spec.mjs scripts/test-basic-theme.mjs
          git commit -m "feat(form-layout): add Basic layout visuals"
          git push
