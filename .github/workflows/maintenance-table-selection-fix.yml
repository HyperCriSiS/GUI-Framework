name: Maintenance Table Selection Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic Table selection fix
        run: python scripts/maintenance-table-selection-fix.py
      - name: Run Compose Table source gate
        run: node scripts/test-compose-table.mjs
      - name: Commit product changes and remove maintenance helpers
        run: |
          rm scripts/maintenance-table-selection-fix.py
          rm .github/workflows/maintenance-table-selection-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(table): make Compose grid selection immediate [android-ci] [device-ci]"
          git push
