name: Maintenance Restore GuiTable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore complete adapter and apply compile fix
        shell: bash
        run: |
          git show 4ebae69177b6344802bc81e8a19aa6e7d8bea571:packages/adapter-compose/src/main/kotlin/GuiTable.kt > packages/adapter-compose/src/main/kotlin/GuiTable.kt
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/adapter-compose/src/main/kotlin/GuiTable.kt')
          s = p.read_text()
          assert 'private fun Modifier.guiTableInteriorLines(' in s
          assert 'GuiDataGridState.entries.map { it.wireValue }' in s
          assert '@Composable\nprivate fun GuiDataGridRowContent(' in s
          if 'import androidx.compose.ui.input.key.key\n' not in s:
              s = s.replace('import androidx.compose.ui.input.key.onPreviewKeyEvent\n', 'import androidx.compose.ui.input.key.key\nimport androidx.compose.ui.input.key.onPreviewKeyEvent\n', 1)
          old = 'private fun resolveTableRecipe(componentId: String, contractCapabilities: GuiComponentCapabilities): GuiVisualRecipe {'
          new = '@Composable\nprivate fun resolveTableRecipe(componentId: String, contractCapabilities: GuiComponentCapabilities): GuiVisualRecipe {'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- packages/adapter-compose/src/main/kotlin/GuiTable.kt
      - name: Commit restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapter-compose/src/main/kotlin/GuiTable.kt
          git commit -m "fix(table): restore complete Compose adapter"
          git push origin HEAD:main
