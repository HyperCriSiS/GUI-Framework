name: Maintenance Scroll Visual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Add Basic Scroll Container visual
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          visual = {
            'base': {
              'root': {
                'foreground': '{semantic.color.textPrimary}',
                'transition': '{motion.interaction.fast}'
              },
              'content': {
                'paddingHorizontal': '{spacing.md}',
                'paddingVertical': '{spacing.md}'
              }
            },
            'sizes': {
              'small': {'content': {'paddingHorizontal': '{spacing.sm}', 'paddingVertical': '{spacing.sm}'}},
              'medium': {'content': {'paddingHorizontal': '{spacing.md}', 'paddingVertical': '{spacing.md}'}},
              'large': {'content': {'paddingHorizontal': '{spacing.lg}', 'paddingVertical': '{spacing.lg}'}}
            },
            'states': {
              'focus': {'root': {'outline': {
                'color': '{semantic.color.focus}',
                'width': '{focus.ring.width}',
                'offset': '{focus.ring.offset}'
              }}}
            }
          }
          def leaves(v):
            if isinstance(v, dict): return sum(leaves(x) for x in v.values())
            if isinstance(v, list): return sum(leaves(x) for x in v)
            return 1
          assert leaves(visual) == 13, leaves(visual)

          p=Path('spec/themes/basic.theme.json')
          basic=json.loads(p.read_text())
          basic['components']['scroll-container']=visual
          basic['components']={k:basic['components'][k] for k in sorted(basic['components'])}
          p.write_text(json.dumps(basic,indent=2)+'\n')

          for file in ['scripts/test-basic-theme.mjs','scripts/test-spec.mjs']:
            p=Path(file); s=p.read_text()
            old='"radio", "select"'
            new='"radio", "scroll-container", "select"'
            if old not in s: raise SystemExit(f'{file}: reference visual anchor missing')
            p.write_text(s.replace(old,new,1))

          p=Path('spec/quality/performance-budgets.json')
          budgets=json.loads(p.read_text())
          for theme in ['basic','modern','glass','frosted-glass','spacey','cyberpunk']:
            budgets['themes'][theme]['maxResolvedVisualLeaves'] += 13
          p.write_text(json.dumps(budgets,indent=2)+'\n')
          PY
      - name: Validate specification
        run: npm run validate:spec
      - name: Compile specification
        run: npm run compile:spec
      - name: Test compiler and visual resolution
        run: npm run test:spec && npm run test:visual-resolution
      - name: Test Basic quality and budget
        run: npm run test:basic-theme && npm run test:basic-performance
      - name: Test inherited theme budgets
        run: npm run test:modern-performance && npm run test:glass-performance && npm run test:frosted-performance && npm run test:spacey-performance && npm run test:cyberpunk-performance
      - name: Test generated visual outputs
        run: npm run build:web-components && npm run build:kotlin-visuals && npm run test:kotlin-visuals
      - name: Commit validated Basic Scroll Container
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/themes/basic.theme.json spec/quality/performance-budgets.json scripts/test-basic-theme.mjs scripts/test-spec.mjs
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'feat(scroll-container): add Basic viewport visuals'
          git push origin HEAD:main
