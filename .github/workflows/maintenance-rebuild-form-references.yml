name: Maintenance Rebuild Form Layout References

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore last compiled reference baseline
        run: |
          git checkout abc229a61dbaedd837004cf2cab1afa201b68d2c -- \
            examples/compose-desktop/src/main/kotlin/Main.kt \
            examples/compose-android/app/src/main/kotlin/gui/framework/examples/android/MainActivity.kt \
            examples/compose-android/app/src/androidTest/kotlin/gui/framework/examples/android/ReferenceRuntimeTest.kt \
            scripts/test-compose-desktop-reference.mjs \
            scripts/test-compose-android-reference.mjs \
            scripts/test-reference-parity.mjs

      - name: Apply Form Layout reference slice
        run: python scripts/maintenance-rebuild-form-references.py

      - name: Validate Compose Desktop reference source
        run: node scripts/test-compose-desktop-reference.mjs

      - name: Validate Compose Android reference source
        run: node scripts/test-compose-android-reference.mjs

      - name: Validate cross-platform reference parity
        run: node scripts/test-reference-parity.mjs

      - name: Compile neutral specification
        run: npm run compile:spec

      - name: Generate Kotlin contracts
        run: npm run build:kotlin-contracts

      - name: Generate Kotlin tokens
        run: npm run build:kotlin-tokens

      - name: Generate Kotlin visual recipes
        run: npm run build:kotlin-visuals

      - name: Generate Kotlin assets
        run: npm run build:kotlin-assets

      - name: Compile generated Kotlin and Compose references
        run: mvn -q -f packages/adapter-compose/pom.xml compile

      - name: Commit validated reference rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            examples/compose-desktop/src/main/kotlin/Main.kt \
            examples/compose-android/app/src/main/kotlin/gui/framework/examples/android/MainActivity.kt \
            examples/compose-android/app/src/androidTest/kotlin/gui/framework/examples/android/ReferenceRuntimeTest.kt \
            scripts/test-compose-desktop-reference.mjs \
            scripts/test-compose-android-reference.mjs \
            scripts/test-reference-parity.mjs
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix(form-layout): rebuild Compose references from compiled baseline [android-ci] [device-ci]'
          git push origin HEAD:main
