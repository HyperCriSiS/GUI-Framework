name: Documentation Contract CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'ARCHITECTURE.md'
      - 'COMPATIBILITY.md'
      - 'PUBLIC_API.md'
      - 'MIGRATION_POLICY.md'
      - 'DISTRIBUTION.md'
      - 'spec/schemas/**'
      - 'spec/accessibility/**'
      - 'spec/quality/**'
      - 'package.json'
      - 'scripts/test-documentation-contract.mjs'
      - '.github/workflows/documentation-contract-ci.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'ARCHITECTURE.md'
      - 'COMPATIBILITY.md'
      - 'PUBLIC_API.md'
      - 'MIGRATION_POLICY.md'
      - 'DISTRIBUTION.md'
      - 'spec/schemas/**'
      - 'spec/accessibility/**'
      - 'spec/quality/**'
      - 'package.json'
      - 'scripts/test-documentation-contract.mjs'
      - '.github/workflows/documentation-contract-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/test-documentation-contract.mjs
