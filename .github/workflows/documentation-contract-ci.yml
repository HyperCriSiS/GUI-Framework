name: Documentation Contract CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'BRANCHING.md'
      - 'SECURITY.md'
      - 'ARCHITECTURE.md'
      - 'COMPATIBILITY.md'
      - 'PUBLIC_API.md'
      - 'MIGRATION_POLICY.md'
      - 'DISTRIBUTION.md'
      - 'spec/schemas/**'
      - 'spec/accessibility/**'
      - 'spec/quality/**'
      - 'package.json'
      - 'scripts/test-documentation-contract.mjs'
      - '.github/workflows/documentation-contract-ci.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'BRANCHING.md'
      - 'SECURITY.md'
      - 'ARCHITECTURE.md'
      - 'COMPATIBILITY.md'
      - 'PUBLIC_API.md'
      - 'MIGRATION_POLICY.md'
      - 'DISTRIBUTION.md'
      - 'spec/schemas/**'
      - 'spec/accessibility/**'
      - 'spec/quality/**'
      - 'package.json'
      - 'scripts/test-documentation-contract.mjs'
      - '.github/workflows/documentation-contract-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node scripts/test-documentation-contract.mjs
