name: Artifact Packaging CI

on:
  pull_request:
    paths:
      - 'distribution/**'
      - 'packages/core/**'
      - 'packages/compiler/**'
      - 'packages/adapter-web/**'
      - 'packages/integration-browser-extension/**'
      - 'packages/integration-web-application/**'
      - 'packages/integration-host-context/**'
      - 'packages/integration-python/**'
      - 'packages/adapter-compose/**'
      - 'packages/integration-desktop/**'
      - 'packages/integration-android/**'
      - 'scripts/test-artifact-packaging-contract.mjs'
      - 'scripts/stage-npm-artifacts.mjs'
      - 'scripts/test-npm-artifacts.mjs'
      - 'scripts/stage-maven-artifacts.mjs'
      - 'scripts/test-maven-artifacts.mjs'
      - 'scripts/stage-python-artifacts.py'
      - 'scripts/test-python-artifacts.py'
      - 'scripts/stage-spec-archive.py'
      - 'scripts/test-spec-archive.mjs'
      - 'scripts/stage-release-manifest.py'
      - 'scripts/test-release-manifest.py'
      - 'scripts/test-release-dry-run-policy.mjs'
      - 'scripts/test-reproducible-staging.py'
      - '.github/workflows/release-candidate-dry-run.yml'
      - 'package.json'
      - '.github/workflows/artifact-packaging-ci.yml'
  push:
    branches: [main]
    paths:
      - 'distribution/**'
      - 'packages/core/**'
      - 'packages/compiler/**'
      - 'packages/adapter-web/**'
      - 'packages/integration-browser-extension/**'
      - 'packages/integration-web-application/**'
      - 'packages/integration-host-context/**'
      - 'packages/integration-python/**'
      - 'packages/adapter-compose/**'
      - 'packages/integration-desktop/**'
      - 'packages/integration-android/**'
      - 'scripts/test-artifact-packaging-contract.mjs'
      - 'scripts/stage-npm-artifacts.mjs'
      - 'scripts/test-npm-artifacts.mjs'
      - 'scripts/stage-maven-artifacts.mjs'
      - 'scripts/test-maven-artifacts.mjs'
      - 'scripts/stage-python-artifacts.py'
      - 'scripts/test-python-artifacts.py'
      - 'scripts/stage-spec-archive.py'
      - 'scripts/test-spec-archive.mjs'
      - 'scripts/stage-release-manifest.py'
      - 'scripts/test-release-manifest.py'
      - 'scripts/test-release-dry-run-policy.mjs'
      - 'scripts/test-reproducible-staging.py'
      - '.github/workflows/release-candidate-dry-run.yml'
      - 'package.json'
      - '.github/workflows/artifact-packaging-ci.yml'

permissions:
  contents: read

jobs:
  npm-packaging:
    name: artifact-packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate artifact package roots and publication lock
        run: npm run test:artifact-packaging
      - name: Build and consume staged npm artifacts
        run: npm run check:npm-artifacts
      - name: Build and consume staged Maven artifacts
        run: npm run check:maven-artifacts
      - name: Install Python staging build tools
        run: python -m pip install --disable-pip-version-check build==1.2.2.post1 setuptools==80.9.0 wheel==0.45.1
      - name: Build and consume staged Python artifacts
        run: npm run check:python-artifacts
      - name: Build and validate staged specification archive
        run: npm run check:spec-archive
      - name: Emit and validate cross-ecosystem staging manifest
        run: npm run stage:release-manifest && npm run test:release-manifest
      - name: Validate release-candidate dry-run policy
        run: npm run test:release-dry-run-policy
