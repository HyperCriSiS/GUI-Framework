name: Maintenance Table Compose Reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reference patch
        run: python scripts/maintenance-table-compose-reference.py
      - name: Validate source gates
        run: |
          node scripts/test-compose-desktop-reference.mjs
          node scripts/test-compose-android-reference.mjs
          git diff --check
      - name: Commit reference integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/compose-desktop/src/main/kotlin/Main.kt examples/compose-android/app/src/main/kotlin/gui/framework/examples/android/MainActivity.kt scripts/test-compose-desktop-reference.mjs scripts/test-compose-android-reference.mjs
          git commit -m "feat(table): integrate Compose references"
          git push origin HEAD:main
