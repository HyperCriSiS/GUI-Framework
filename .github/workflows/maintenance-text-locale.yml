name: Maintenance Text Locale

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply locale robustness payload
        run: python scripts/maintenance-text-locale.py
      - name: Syntax-check new JavaScript gates
        run: |
          node --check examples/text-locale-fixtures.mjs
          node --check examples/web-reference/locale-reference.mjs
          node --check scripts/test-text-locale-robustness.mjs
          node --check scripts/test-web-text-locale-reference.mjs
          node --check scripts/test-compose-text-locale.mjs
          node --check tests/browser/text-locale-reference.spec.mjs
      - name: Run source-only locale gates
        run: |
          npm run test:web-text-locale-reference
          npm run test:kotlin-text-locale
      - name: Commit product changes and remove payload helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapter-web/src/generate-components-css.mjs examples/text-locale-fixtures.mjs examples/web-reference/locale.html examples/web-reference/locale-reference.mjs scripts/test-text-locale-robustness.mjs scripts/test-web-text-locale-reference.mjs scripts/test-compose-text-locale.mjs tests/browser/text-locale-reference.spec.mjs examples/compose-android/app/src/main/kotlin/gui/framework/examples/android/MainActivity.kt examples/compose-desktop/src/main/kotlin/Main.kt examples/compose-android/app/src/androidTest/kotlin/gui/framework/examples/android/ReferenceRuntimeTest.kt package.json
          git rm -r scripts/maintenance-locale-payload scripts/maintenance-text-locale.py
          git diff --cached --check
          git commit -m "test(locale): add cross-platform text robustness gates [skip ci]"
          git push origin HEAD:main
