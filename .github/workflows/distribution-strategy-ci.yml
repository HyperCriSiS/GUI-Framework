name: Distribution Strategy CI

on:
  push:
    branches: [main]
    paths:
      - "DISTRIBUTION.md"
      - "distribution/**"
      - "scripts/test-distribution-strategy.mjs"
      - ".github/workflows/distribution-strategy-ci.yml"
  pull_request:
    paths:
      - "DISTRIBUTION.md"
      - "distribution/**"
      - "scripts/test-distribution-strategy.mjs"
      - ".github/workflows/distribution-strategy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/test-distribution-strategy.mjs
