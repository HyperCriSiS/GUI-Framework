name: Distribution Strategy CI

on:
  push:
    branches: [main]
    paths:
      - "DISTRIBUTION.md"
      - "distribution/**"
      - "scripts/test-distribution-strategy.mjs"
      - ".github/workflows/distribution-strategy-ci.yml"
  pull_request:
    paths:
      - "DISTRIBUTION.md"
      - "distribution/**"
      - "scripts/test-distribution-strategy.mjs"
      - ".github/workflows/distribution-strategy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node scripts/test-distribution-strategy.mjs
