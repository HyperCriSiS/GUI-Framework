name: One-shot neutralize escaped showcase fixture

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  neutralize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/showcase-theme-gallery' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: fix/showcase-theme-gallery
          fetch-depth: 0
      - name: Neutralize escaped personalized fixtures and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -Il -F 'jan@example\.com' -- ':!.github/workflows/neutralize-escaped-showcase-fixture.yml' || true)"
          if [[ -n "$matches" ]]; then
            while IFS= read -r file; do
              python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace(r"jan@example\.com", r"demo@example\.invalid"))' "$file"
            done <<< "$matches"
          fi
          git rm .github/workflows/neutralize-escaped-showcase-fixture.yml
          if git grep -n -i 'jan@example'; then
            echo 'Personalized fixture reference still present after neutralization.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(fixtures): neutralize escaped identity expectations'
          git push origin HEAD:fix/showcase-theme-gallery
