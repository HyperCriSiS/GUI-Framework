name: Fix Phase 11 Weight Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: phase11-design-gallery
      - name: Remove invalid explicit weight import
        shell: bash
        run: |
          FILE='examples/showcase-shared/src/main/kotlin/gui/framework/examples/showcase/ShowcaseExplorerContent.kt'
          grep -q '^import androidx.compose.foundation.layout.weight$' "$FILE"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$FILE"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'fix(showcase): use scoped Compose weight modifier'
          git push origin HEAD:phase11-design-gallery
