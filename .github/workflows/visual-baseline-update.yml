name: Visual Baseline Update

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Feature/test branch that will receive refreshed browser PNG baselines"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visual-baseline-update-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate target branch
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target_branch }}'
          if [[ ! "$target" =~ ^(feat|fix|test|ci)/[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing unsupported target branch: $target" >&2
            exit 1
          fi

      - name: Checkout target branch read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.target_branch }}
          persist-credentials: false

      - name: Capture source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Compile neutral specification
        run: npm run compile:spec

      - name: Generate Web token output
        run: npm run build:web-tokens

      - name: Generate Web component output
        run: npm run build:web-components

      - name: Generate Web assets
        run: npm run build:web-assets

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --audit=false

      - name: Install Chromium browser
        run: npm run install:web-browser

      - name: Render six theme baselines
        run: npx playwright test tests/browser/theme-visual-baselines.spec.mjs --update-snapshots

      - name: Validate rendered files
        shell: bash
        run: |
          set -euo pipefail
          dir='tests/browser/__snapshots__/theme-visual-baselines.spec.mjs'
          test -d "$dir"
          count="$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          if [[ "$count" != '6' ]]; then
            echo "Expected exactly six theme PNG baselines, found $count" >&2
            exit 1
          fi
          if find "$dir" -maxdepth 1 -type l -print -quit | grep -q .; then
            echo 'Snapshot directory must not contain symlinks' >&2
            exit 1
          fi
          if find "$dir" -maxdepth 1 -type f ! -name '*.png' -print -quit | grep -q .; then
            echo 'Snapshot directory contains an unexpected non-PNG file' >&2
            exit 1
          fi

      - name: Upload rendered PNGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: theme-visual-baselines
          path: tests/browser/__snapshots__/theme-visual-baselines.spec.mjs/*.png
          if-no-files-found: error
          retention-days: 1

  commit:
    name: commit
    runs-on: ubuntu-latest
    needs: render
    permissions:
      contents: write
    steps:
      - name: Validate target branch
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target_branch }}'
          if [[ ! "$target" =~ ^(feat|fix|test|ci)/[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing unsupported target branch: $target" >&2
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify target branch did not move after rendering
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected='${{ needs.render.outputs.source_sha }}'
          if [[ "$actual" != "$expected" ]]; then
            echo "Target branch moved after rendering: expected $expected, found $actual" >&2
            exit 1
          fi

      - name: Download rendered PNGs
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.1
        with:
          name: theme-visual-baselines
          path: .baseline-artifact

      - name: Validate artifact contents
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .baseline-artifact -type f -name '*.png' | wc -l | tr -d ' ')"
          if [[ "$count" != '6' ]]; then
            echo "Expected exactly six PNGs in artifact, found $count" >&2
            exit 1
          fi
          if find .baseline-artifact -type l -print -quit | grep -q .; then
            echo 'Artifact must not contain symlinks' >&2
            exit 1
          fi
          if find .baseline-artifact -type f ! -name '*.png' -print -quit | grep -q .; then
            echo 'Artifact contains an unexpected non-PNG file' >&2
            exit 1
          fi

      - name: Replace snapshot directory and commit
        shell: bash
        run: |
          set -euo pipefail
          target_dir='tests/browser/__snapshots__/theme-visual-baselines.spec.mjs'
          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          find .baseline-artifact -type f -name '*.png' -exec cp '{}' "$target_dir"/ \;
          rm -rf .baseline-artifact
          git add -- "$target_dir"
          if git diff --cached --quiet; then
            echo 'Visual baselines already match the renderer output.'
            exit 0
          fi
          unexpected="$(git diff --cached --name-only -- . ":(exclude)$target_dir/**")"
          if [[ -n "$unexpected" ]]; then
            echo "Refusing unexpected staged paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(web): update theme visual baselines [browser-ci]'
          git push origin HEAD:'${{ inputs.target_branch }}'
