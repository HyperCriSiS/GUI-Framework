name: Maintenance Tree Reference Parity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Tree reference parity patch
        run: python scripts/maintenance-tree-reference-parity.py
      - name: Validate Tree reference parity
        run: |
          node scripts/test-compose-tree.mjs
          node scripts/test-web-tree-reference.mjs
          node scripts/test-compose-desktop-reference.mjs
          node scripts/test-compose-android-reference.mjs
          node scripts/test-reference-parity.mjs
          npm run compile:spec
          npm run build:kotlin-contracts
          npm run build:kotlin-tokens
          npm run build:kotlin-visuals
          npm run build:kotlin-assets
          npm run compile:kotlin-contracts
      - name: Commit product changes and remove maintenance helpers
        run: |
          git rm scripts/maintenance-tree-reference-parity.py .github/workflows/maintenance-tree-reference-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json examples/reference-scenarios.json examples/compose-desktop/src/main/kotlin/Main.kt examples/compose-android/app/src/main/kotlin/gui/framework/examples/android/MainActivity.kt scripts/test-compose-desktop-reference.mjs scripts/test-compose-android-reference.mjs scripts/test-reference-parity.mjs
          git commit -m "feat(tree): integrate shared hierarchy references [android-ci]"
          git push
