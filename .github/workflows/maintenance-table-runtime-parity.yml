name: Maintenance Table Runtime Parity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply runtime and parity patch
        run: python scripts/maintenance-table-runtime-parity.py
      - name: Validate parity and browser syntax
        run: |
          node scripts/test-reference-parity.mjs
          node --check tests/browser/table-reference.spec.mjs
          git diff --check
      - name: Commit completion gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/reference-scenarios.json scripts/test-reference-parity.mjs examples/compose-android/app/src/androidTest/kotlin/gui/framework/examples/android/ReferenceRuntimeTest.kt tests/browser/table-reference.spec.mjs
          git commit -m "test(table): gate reference runtime parity [browser-ci] [android-ci] [device-ci]"
          git push origin HEAD:main
